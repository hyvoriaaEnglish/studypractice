```html
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Đăng ký tài khoản - Hyvoria English</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      .container {
        width: 350px;
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        margin-bottom: 25px;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #111;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.8;
      }

      #message {
        text-align: center;
        margin-top: 15px;
      }

      .login-link {
        text-align: center;
        margin-top: 15px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Đăng ký</h1>

      <input type="email" id="email" placeholder="Email của bạn" />

      <input type="password" id="password" placeholder="Mật khẩu" />

      <button id="registerBtn">Đăng ký</button>

      <p id="message"></p>

      <div class="login-link">
        Đã có tài khoản?
        <a href="login.html"> Đăng nhập </a>
      </div>
    </div>

    <!-- =========================
         SUPABASE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>

    <!-- =========================
         REGISTER
    ========================== -->

    <script>
      document
        .getElementById("registerBtn")
        .addEventListener("click", async function () {
          const email = document.getElementById("email").value.trim();

          const password = document.getElementById("password").value;

          const message = document.getElementById("message");

          // Kiểm tra bỏ trống

          if (!email || !password) {
            message.textContent = "Vui lòng nhập email và mật khẩu.";

            return;
          }

          // Đăng ký tài khoản

          const { data, error } = await supabaseClient.auth.signUp({
            email: email,

            password: password,
          });

          // Nếu có lỗi

          if (error) {
            message.textContent = error.message;

            return;
          }

          // Đăng ký thành công

          message.textContent =
            "Đăng ký thành công! Vui lòng kiểm tra email để xác nhận tài khoản.";
        });
    </script>
  </body>
</html>
```
