        min-height: 100vh;
        padding: 30px 15px;
      }

      .container {
        max-width: 900px;
        margin: auto;
      }

      /* HEADER */
      .header {
        background: linear-gradient(135deg, #f9c900, #ffdf55);
        padding: 35px 25px;
        border-radius: 25px;
        text-align: center;
        margin-bottom: 25px;
        box-shadow: 0 10px 30px rgba(180, 130, 0, 0.18);
      }

      .header h1 {
        font-size: 32px;
        color: #4a3800;
        margin-bottom: 10px;
      }

      .header p {
        font-size: 16px;
        color: #665000;
      }

      /* PROGRESS */
      .progress-box {
        background: white;
        padding: 18px 22px;
        border-radius: 18px;
        margin-bottom: 25px;
        box-shadow: 0 5px 20px rgba(150, 110, 0, 0.1);
        position: sticky;
        top: 10px;
        z-index: 10;
      }

      .progress-info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-weight: bold;
        color: #705600;
      }

      .progress-bar {
        width: 100%;
        height: 12px;
        background: #f1e6b8;
        border-radius: 20px;
        overflow: hidden;
      }

      .progress-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #e8ad00, #ffd83d);
        transition: width 0.3s ease;
      }

      /* QUESTION CARD */
      .question-card {
        background: white;
        border-radius: 22px;
        padding: 28px;
        margin-bottom: 22px;
        box-shadow: 0 7px 25px rgba(150, 110, 0, 0.1);
        border: 2px solid transparent;
        transition: 0.3s;
      }

      .question-card:hover {
        border-color: #f4ca25;
      }

      .question-number {
        display: inline-block;
        background: #fff0a8;
        color: #856600;
        padding: 6px 12px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 14px;
      }

      .question {
        font-size: 18px;
        line-height: 1.6;
        font-weight: 600;
        margin-bottom: 20px;
      }

      /* ANSWERS */
      .options {
        display: grid;
        gap: 12px;
      }

      .option {
        width: 100%;
        text-align: left;
        padding: 15px 18px;
        background: #fffdf2;
        border: 2px solid #eadb9c;
        border-radius: 14px;
        cursor: pointer;
        font-size: 16px;
        color: #4b3b00;
        transition: all 0.2s ease;
      }

      .option:hover:not(:disabled) {
        background: #fff5b9;
        border-color: #e7b900;
        transform: translateY(-2px);
      }

      .option:disabled {
        cursor: default;
      }

      .option.correct {
        background: #e8f8e8;
        border-color: #43a047;
        color: #236b27;
        font-weight: bold;
      }

      .option.wrong {
        background: #fff0f0;
        border-color: #e53935;
        color: #a82020;
        font-weight: bold;
      }

      /* RESULT */
      .feedback {
        display: none;
        margin-top: 20px;
        padding: 18px;
        border-radius: 15px;
        line-height: 1.7;
      }

      .feedback.correct-feedback {
        display: block;
        background: #edf9ed;
        border-left: 5px solid #43a047;
        color: #28642b;
      }

      .feedback.wrong-feedback {
        display: block;
        background: #fff1f1;
        border-left: 5px solid #e53935;
        color: #8d2020;
      }

        font-weight: bold;
        margin-bottom: 7px;
      }

      }

        padding: 35px;

        background: #705600;

        }
      }
    </style>
  </head>

      let score = 0;
      let userAnswers = [];

      const quiz = document.getElementById("quiz");
      const progressText = document.getElementById("progressText");
      const progressFill = document.getElementById("progressFill");
      const result = document.getElementById("result");
      const finalScore = document.getElementById("finalScore");
      const resultMessage = document.getElementById("resultMessage");

      function loadQuiz() {
        quiz.innerHTML = "";

        questions.forEach((item, index) => {
          const card = document.createElement("div");
          card.className = "question-card";

          card.innerHTML = `
      <div class="question-number">
        Question ${index + 1}
      </div>

      <div class="question">
        ${item.q}
      </div>

      <div class="options">

        ${item.options
          .map(
            (option, optionIndex) => `
          <button
            class="option"
            onclick="checkAnswer(${index}, ${optionIndex}, this)"
          >
            <b>${String.fromCharCode(65 + optionIndex)}.</b>
            ${option}
          </button>
        `,
          )
          .join("")}

      </div>

      <div class="feedback" id="feedback-${index}"></div>
    `;

          quiz.appendChild(card);
        });
      }

      function checkAnswer(questionIndex, selectedIndex, clickedButton) {
        if (userAnswers[questionIndex] !== undefined) {
          return;
        }

        userAnswers[questionIndex] = selectedIndex;
        answered++;

        const question = questions[questionIndex];
        const buttons = clickedButton.parentElement.querySelectorAll(".option");
        const feedback = document.getElementById(`feedback-${questionIndex}`);

        buttons.forEach((button) => {
          button.disabled = true;
        });

        // Đúng
        if (selectedIndex === question.answer) {
          score++;

          clickedButton.classList.add("correct");

          feedback.className = "feedback correct-feedback";

          feedback.innerHTML = `
      <div class="feedback-title">
        ✅ Correct!
      </div>

      <div>
        Bạn đã chọn đúng: 
        <b>${String.fromCharCode(65 + question.answer)}. ${question.options[question.answer]}</b>
      </div>

      <div class="explanation">
        💡 <b>Giải thích:</b> ${question.explanation}
      </div>
    `;
        }

        // Sai
        else {
          clickedButton.classList.add("wrong");

          buttons[question.answer].classList.add("correct");

          feedback.className = "feedback wrong-feedback";

          feedback.innerHTML = `
      <div class="feedback-title">
        ❌ Incorrect!
      </div>

      <div>
        Bạn chọn:
        <b>${String.fromCharCode(65 + selectedIndex)}. ${question.options[selectedIndex]}</b>
      </div>

      <div>
        Đáp án đúng:
        <b>${String.fromCharCode(65 + question.answer)}. ${question.options[question.answer]}</b>
      </div>

      <div class="explanation">
        💡 <b>Giải thích:</b> ${question.explanation}
      </div>
    `;
        }

        updateProgress();

        if (answered === questions.length) {
          showResult();
        }
      }

      function updateProgress() {
        progressText.textContent = `${answered} / ${questions.length} answered`;

        const percentage = (answered / questions.length) * 100;

        progressFill.style.width = percentage + "%";
      }

      function showResult() {
        result.style.display = "block";

        finalScore.textContent = `${score} / ${questions.length}`;

        let percentage = (score / questions.length) * 100;

        if (percentage >= 90) {
          resultMessage.textContent = "🏆 Excellent! Bạn nắm idioms rất tốt!";
        } else if (percentage >= 75) {
          resultMessage.textContent =
            "🌟 Great job! Bạn đã hiểu phần lớn các idioms.";
        } else if (percentage >= 60) {
          resultMessage.textContent =
            "👍 Good effort! Hãy ôn lại những idioms bạn đã sai.";
        } else {
          resultMessage.textContent =
            "📚 Keep practicing! Hãy học lại idioms và thử lại nhé.";
        }

        setTimeout(() => {
          result.scrollIntoView({
            behavior: "smooth",
            block: "center",
          });
        }, 300);
      }

      function restartQuiz() {
        answered = 0;
        score = 0;
        userAnswers = [];

        result.style.display = "none";

        progressText.textContent = "0 / 40 answered";

        progressFill.style.width = "0%";

        loadQuiz();

        window.scrollTo({
          top: 0,
          behavior: "smooth",
        });
      }

      loadQuiz();
    </script>
  </body>
</html>
