          explanation: "<b>eat like a horse</b> = ăn rất nhiều, ăn khỏe.",
        },

        {
          q: "We didn't win the competition, but we learned a lot from the experience. After all, __________.",
          options: [
            "every cloud has a silver lining",
            "don't put all your eggs in one basket",
            "face the music",
            "cry over spilt milk",
          ],
          answer: 0,
          explanation:
            "<b>every cloud has a silver lining</b> = trong mọi tình huống khó khăn vẫn có thể có một điều tốt đẹp hoặc bài học tích cực.",
        },

        {
          q: "After breaking the rules, the student had to __________ and accept the consequences.",
          options: [
            "fall into place",
            "face the music",
            "come in handy",
            "bring something to light",
          ],
          answer: 1,
          explanation:
            "<b>face the music</b> = đối mặt với hậu quả của hành động hoặc quyết định của mình.",
        },
      ];

      /* =========================
   VARIABLES
========================= */

      let answered = 0;

      let score = 0;

      let userAnswers = [];

      const quiz = document.getElementById("quiz");

      const progressText = document.getElementById("progressText");

      const progressFill = document.getElementById("progressFill");

      const result = document.getElementById("result");

      const finalScore = document.getElementById("finalScore");

      const resultMessage = document.getElementById("resultMessage");

      /* =========================
   LOAD QUIZ
========================= */

      function loadQuiz() {
        quiz.innerHTML = "";

        questions.forEach((item, index) => {
          const card = document.createElement("div");

          card.className = "question-card";

          card.innerHTML = `

                <div class="question-number">

                    Question ${index + 1}

                </div>


                <div class="question">

                    ${item.q}

                </div>


                <div class="options">

                    ${item.options
                      .map(
                        (option, optionIndex) => `

                            <button

                                class="option"

                                onclick="checkAnswer(

                                    ${index},

                                    ${optionIndex},

                                    this

                                )"

                            >

                                <b>

                                    ${String.fromCharCode(65 + optionIndex)}.

                                </b>

                                ${option}

                            </button>

                        `,
                      )
                      .join("")}

                </div>


                <div

                    class="feedback"

                    id="feedback-${index}"

                >

                </div>

            `;

          quiz.appendChild(card);
        });
      }

      /* =========================
   CHECK ANSWER
========================= */

      function checkAnswer(questionIndex, selectedIndex, clickedButton) {
        if (userAnswers[questionIndex] !== undefined) {
          return;
        }

        userAnswers[questionIndex] = selectedIndex;

        answered++;

        const question = questions[questionIndex];

        const buttons = clickedButton.parentElement.querySelectorAll(".option");

        const feedback = document.getElementById(`feedback-${questionIndex}`);

        buttons.forEach((button) => {
          button.disabled = true;
        });

        /* =====================
       CORRECT
    ===================== */

        if (selectedIndex === question.answer) {
          score++;

          clickedButton.classList.add("correct");

          feedback.className = "feedback correct-feedback";

          feedback.innerHTML = `

            <div class="feedback-title">

                ✅ Correct!

            </div>


            <div>

                Đáp án của bạn:

                <b>

                    ${String.fromCharCode(65 + question.answer)}.

                    ${question.options[question.answer]}

                </b>

            </div>


            <div class="explanation">

                💡

                <b>
                    Giải thích:
                </b>

                ${question.explanation}

            </div>

        `;
        } else {

        /* =====================
       WRONG
    ===================== */
          clickedButton.classList.add("wrong");

          buttons[question.answer].classList.add("correct");

          feedback.className = "feedback wrong-feedback";

          feedback.innerHTML = `

            <div class="feedback-title">

                ❌ Incorrect!

            </div>


            <div>

                Bạn chọn:

                <b>

                    ${String.fromCharCode(65 + selectedIndex)}.

                    ${question.options[selectedIndex]}

                </b>

            </div>


            <div>

                Đáp án đúng:

                <b>

                    ${String.fromCharCode(65 + question.answer)}.

                    ${question.options[question.answer]}

                </b>

            </div>


            <div class="explanation">

                💡

                <b>
                    Giải thích:
                </b>

                ${question.explanation}

            </div>

        `;
        }

        updateProgress();

        if (answered === questions.length) {
          showResult();
        }
      }

      /* =========================
   UPDATE PROGRESS
========================= */

      function updateProgress() {
        progressText.textContent = `${answered} / ${questions.length} answered`;

        const percentage = (answered / questions.length) * 100;

        progressFill.style.width = percentage + "%";
      }

      /* =========================
   SHOW RESULT
========================= */

      function showResult() {
        result.style.display = "block";

        finalScore.textContent = `${score} / ${questions.length}`;

        const percentage = (score / questions.length) * 100;

        if (percentage >= 90) {
          resultMessage.textContent =
            "🏆 Outstanding! Bạn đã nắm vững các idioms B2–C1 cực kỳ tốt!";
        } else if (percentage >= 75) {
          resultMessage.textContent =
            "🌟 Excellent! Khả năng hiểu idioms của bạn rất tốt!";
        } else if (percentage >= 60) {
          resultMessage.textContent =
            "👍 Good job! Bạn đã hiểu khá nhiều idioms. Hãy ôn lại những câu sai nhé!";
        } else {
          resultMessage.textContent =
            "📚 Keep practicing! Hãy ôn lại các idioms và thử lại bài test nhé!";
        }

        setTimeout(
          () => {
            result.scrollIntoView({
              behavior: "smooth",

              block: "center",
            });
          },

          300,
        );
      }

      /* =========================
   RESTART QUIZ
========================= */

      function restartQuiz() {
        answered = 0;

        score = 0;

        userAnswers = [];

        result.style.display = "none";

        progressText.textContent = "0 / 42 answered";

        progressFill.style.width = "0%";

        loadQuiz();

        window.scrollTo({
          top: 0,

          behavior: "smooth",
        });
      }

      /* =========================
   START
========================= */

      loadQuiz();
    </script>
  </body>
</html>
