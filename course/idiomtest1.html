      .container {
        max-width: 900px;
        margin: auto;
      }

      /* HEADER */
      .header {
        background: linear-gradient(135deg, #2e7d32, #66bb6a);
        padding: 35px 25px;
        border-radius: 25px;
        text-align: center;

      }

      /* PROGRESS */
      .progress-box {
        background: white;
        padding: 18px 22px;
        border-radius: 18px;
        margin-bottom: 25px;
        box-shadow: 0 5px 20px rgba(46, 125, 50, 0.1);
        position: sticky;
        top: 10px;
        z-index: 10;
      }

      .progress-info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-weight: bold;
        color: #2e7d32;
      }

      .progress-bar {
        width: 100%;
        height: 12px;
        background: #dcefe0;
        border-radius: 20px;
        overflow: hidden;
      }

      .progress-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #2e7d32, #66bb6a);
        transition: width 0.3s ease;
      }

      /* QUESTION CARD */
      .question-card {
        background: white;
        border-radius: 22px;
        padding: 28px;

        border-color: #81c784;
      }

      .question-number {
        display: inline-block;
        background: #e3f3e5;
        color: #2e7d32;
        padding: 6px 12px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 14px;
      }

      .question {
        font-size: 18px;
        line-height: 1.6;
        font-weight: 600;
        margin-bottom: 20px;
      }

      /* ANSWERS */
      .options {
        display: grid;
        gap: 12px;
      }

      .option {
        width: 100%;
        text-align: left;
        padding: 15px 18px;
        background: #f8fcf8;
        border: 2px solid #c8e2cc;
        border-radius: 14px;
        cursor: pointer;
        font-size: 16px;
        color: #234d2d;
        transition: all 0.2s ease;
      }

      .option:hover:not(:disabled) {
        background: #e8f5e9;
        border-color: #4caf50;
        transform: translateY(-2px);
      }

      .option:disabled {
        cursor: default;
      }

      /* ĐÁP ÁN ĐÚNG */
      .option.correct {
        background: #e7f7e9;
        border-color: #2e7d32;
        color: #1b5e20;
        font-weight: bold;
      }

      /* ĐÁP ÁN SAI */
      .option.wrong {
        background: #fff0f0;
        border-color: #e53935;
        color: #a82020;
        font-weight: bold;
      }

      /* FEEDBACK */
      .feedback {
        display: none;
        margin-top: 20px;
        padding: 18px;
        border-radius: 15px;
        line-height: 1.7;
      }

      .feedback.correct-feedback {
        display: block;
        background: #edf8ee;
        border-left: 5px solid #43a047;
        color: #28642b;
      }

      .feedback.wrong-feedback {
        display: block;
        background: #fff1f1;
        border-left: 5px solid #e53935;
        color: #8d2020;
      }

      .feedback-title {
        font-size: 17px;
        font-weight: bold;
        margin-bottom: 7px;
      }

      .explanation {
        margin-top: 8px;
      }

      /* FINAL RESULT */
      .result {
        display: none;
        background: linear-gradient(135deg, #2e7d32, #66bb6a);
        color: white;
        padding: 35px;
        border-radius: 25px;
        text-align: center;
        margin-top: 35px;
        box-shadow: 0 10px 30px rgba(46, 125, 50, 0.25);
      }

      .result h2 {
        font-size: 30px;
        margin-bottom: 12px;
      }

      .score {
        font-size: 48px;
        font-weight: bold;
        margin: 15px 0;
      }

      .result p {
        font-size: 18px;
        margin-bottom: 20px;
      }

      .restart-btn {
        border: none;
        background: white;
        color: #2e7d32;
        padding: 14px 28px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }

      .restart-btn:hover {
        background: #e8f5e9;
        transform: translateY(-2px);
      }

      /* MOBILE */
      @media (max-width: 600px) {
        body {
          padding: 15px 10px;

          padding: 25px 15px;

        }

          font-size: 16px;
        }

        .option {
          font-size: 15px;
          padding: 13px 14px;
        }

        .score {
          font-size: 40px;
        }
      }
    </style>
  </head>

      let answered = 0;
      let score = 0;
      let userAnswers = [];

      const quiz = document.getElementById("quiz");
      const progressText = document.getElementById("progressText");
      const progressFill = document.getElementById("progressFill");
      const result = document.getElementById("result");
      const finalScore = document.getElementById("finalScore");
      const resultMessage = document.getElementById("resultMessage");

      /* LOAD QUIZ */

      function loadQuiz() {
        quiz.innerHTML = "";

        questions.forEach((item, index) => {
          const card = document.createElement("div");

          card.className = "question-card";

          card.innerHTML = `

      <div class="question-number">
        Question ${index + 1}
      </div>

      <div class="question">
        ${item.q}
      </div>

      <div class="options">

        ${item.options
          .map(
            (option, optionIndex) => `

          <button
            class="option"
            onclick="checkAnswer(${index}, ${optionIndex}, this)"
          >

            <b>${String.fromCharCode(65 + optionIndex)}.</b>
            ${option}

          </button>

        `,
          )
          .join("")}

      </div>

      <div
        class="feedback"
        id="feedback-${index}"
      ></div>

    `;

          quiz.appendChild(card);
        });
      }

      /* CHECK ANSWER */

      function checkAnswer(questionIndex, selectedIndex, clickedButton) {
        /* Không cho chọn lại */

        if (userAnswers[questionIndex] !== undefined) {
          return;
        }

        userAnswers[questionIndex] = selectedIndex;

        answered++;

        const question = questions[questionIndex];

        const buttons = clickedButton.parentElement.querySelectorAll(".option");

        const feedback = document.getElementById(`feedback-${questionIndex}`);

        /* Disable tất cả đáp án */

        buttons.forEach((button) => {
          button.disabled = true;
        });

        /* ĐÁP ÁN ĐÚNG */

        if (selectedIndex === question.answer) {
          score++;

          clickedButton.classList.add("correct");

          feedback.className = "feedback correct-feedback";

          feedback.innerHTML = `

      <div class="feedback-title">
        ✅ Correct!
      </div>

      <div>
        Bạn đã chọn đúng:
        <b>
          ${String.fromCharCode(65 + question.answer)}.
          ${question.options[question.answer]}
        </b>
      </div>

      <div class="explanation">

        💡 <b>Giải thích:</b>
        ${question.explanation}

      </div>

    `;
        } else {
          /* ĐÁP ÁN SAI */
          clickedButton.classList.add("wrong");

          buttons[question.answer].classList.add("correct");

          feedback.className = "feedback wrong-feedback";

          feedback.innerHTML = `

      <div class="feedback-title">
        ❌ Incorrect!
      </div>

      <div>
        Bạn chọn:
        <b>
          ${String.fromCharCode(65 + selectedIndex)}.
          ${question.options[selectedIndex]}
        </b>
      </div>

      <div>
        Đáp án đúng:
        <b>
          ${String.fromCharCode(65 + question.answer)}.
          ${question.options[question.answer]}
        </b>
      </div>

      <div class="explanation">

        💡 <b>Giải thích:</b>
        ${question.explanation}

      </div>

    `;
        }

        updateProgress();

        /* Hoàn thành bài */

        if (answered === questions.length) {
          showResult();
        }
      }

      /* UPDATE PROGRESS */

      function updateProgress() {
        progressText.textContent = `${answered} / ${questions.length} answered`;

        const percentage = (answered / questions.length) * 100;

        progressFill.style.width = percentage + "%";
      }

      /* SHOW FINAL RESULT */

      function showResult() {
        result.style.display = "block";

        finalScore.textContent = `${score} / ${questions.length}`;

        const percentage = (score / questions.length) * 100;

        if (percentage >= 90) {
          resultMessage.textContent =
            "🏆 Excellent! Bạn nắm idioms cực kỳ tốt!";
        } else if (percentage >= 75) {
          resultMessage.textContent =
            "🌟 Great job! Bạn đã hiểu phần lớn các idioms.";
        } else if (percentage >= 60) {
          resultMessage.textContent =
            "👍 Good effort! Hãy ôn lại những idioms bạn đã sai.";
        } else {
          resultMessage.textContent =
            "📚 Keep practicing! Hãy học lại idioms và thử lại nhé.";
        }

        setTimeout(() => {
          result.scrollIntoView({
            behavior: "smooth",
            block: "center",
          });
        }, 300);
      }

      /* RESTART QUIZ */

      function restartQuiz() {
        answered = 0;

        score = 0;

        userAnswers = [];

        result.style.display = "none";

        progressText.textContent = "0 / 32 answered";

        progressFill.style.width = "0%";

        loadQuiz();

        window.scrollTo({
          top: 0,
          behavior: "smooth",
        });
      }

      /* START */

      loadQuiz();
    </script>
