    <style>
      /* =====================================================
     RESET
  ===================================================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* =====================================================
     BODY
  ===================================================== */

      body {
        min-height: 100vh;

        font-family: "Segoe UI", Arial, sans-serif;

        background:
          radial-gradient(
            circle at 10% 10%,
            rgba(255, 190, 210, 0.25),
            transparent 25%
          ),
          radial-gradient(
            circle at 90% 90%,
            rgba(255, 190, 210, 0.2),
            transparent 25%
          ),
          #fff8fa;

        display: flex;

        justify-content: center;

        align-items: center;

        position: relative;

        overflow: hidden;

        color: #211c1e;
      }

      /* =====================================================
     DECORATIVE BACKGROUND
  ===================================================== */

      body::before {
        content: "";

        position: fixed;

        width: 650px;
        height: 650px;

        border-radius: 50%;

        background: linear-gradient(135deg, #f7c5d3, #fce4eb);

        left: -350px;
        bottom: -350px;

        opacity: 0.8;

        z-index: 0;
      }

      body::after {
        content: "";

        position: fixed;

        width: 450px;
        height: 450px;

        border-radius: 50%;

        background: linear-gradient(135deg, #fce3eb, #f7c5d3);

        right: -250px;
        top: -250px;

        opacity: 0.6;

        z-index: 0;
      }

      /* =====================================================
     DECORATIVE STARS
  ===================================================== */

      .decorations {
        position: fixed;

        inset: 0;

        pointer-events: none;

        z-index: 1;
      }

      .star {
        position: absolute;

        color: #e98ca5;

        opacity: 0.45;

        animation: floating 4s ease-in-out infinite;
      }

      .star:nth-child(1) {
        top: 15%;
        left: 12%;

        font-size: 25px;
      }

      .star:nth-child(2) {
        top: 25%;
        right: 15%;

        font-size: 18px;
      }

      .star:nth-child(3) {
        bottom: 20%;
        left: 18%;

        font-size: 20px;
      }

      .star:nth-child(4) {
        bottom: 15%;
        right: 12%;

        font-size: 30px;
      }

      @keyframes floating {
        0% {
          transform: translateY(0px) rotate(0deg);
        }

        50% {
          transform: translateY(-8px) rotate(8deg);
        }

        100% {
          transform: translateY(0px) rotate(0deg);
        }
      }

      /* =====================================================
     SHOPPING
  ===================================================== */

      .shopping {
        position: absolute;

        top: 28px;
        left: 35px;

        z-index: 10;

        text-decoration: none;

        color: #211c1e;

        font-size: 15px;

        font-weight: 600;

        padding: 10px 18px;

        border-radius: 30px;

        background: rgba(255, 255, 255, 0.7);

        border: 1px solid rgba(33, 28, 30, 0.15);

        transition: all 0.3s ease;
      }

      .shopping:hover {
        background: #211c1e;

        color: #f7c5d3;

        transform: translateY(-3px);

        box-shadow: 0 8px 20px rgba(33, 28, 30, 0.15);
      }

      /* =====================================================
     ACCOUNT MENU
  ===================================================== */

      .account-menu {
        position: absolute;

        top: 25px;
        right: 30px;

        z-index: 10;

        display: flex;

        align-items: center;

        gap: 10px;
      }

      .account-btn {
        text-decoration: none;

        padding: 10px 18px;

        border-radius: 30px;

        font-size: 14px;

        font-weight: 600;

        white-space: nowrap;

        transition: all 0.3s ease;
      }

      /* ACCOUNT */

      .account-page-btn {
        color: #211c1e;

        background: #f9d9e2;

        border: 1px solid #f0b8c8;
      }

      /* LOGIN */

      .login-btn {
        color: #211c1e;

        background: rgba(255, 255, 255, 0.8);

        border: 1px solid #211c1e;
      }

      /* REGISTER */

      .register-btn {
        color: white;

        background: #211c1e;

        border: 1px solid #211c1e;
      }

      .account-btn:hover {
        transform: translateY(-3px);

        box-shadow: 0 8px 20px rgba(33, 28, 30, 0.15);
      }

      .register-btn:hover {
        background: #e98ca5;

        border-color: #e98ca5;

        color: white;
      }

      /* =====================================================
     MAIN
  ===================================================== */

      .main {
        position: relative;

        z-index: 5;

        display: flex;

        flex-direction: column;

        align-items: center;

        gap: 35px;
      }

      /* =====================================================
     LOGO / TITLE
  ===================================================== */

      .logo {
        text-align: center;

        margin-bottom: 5px;
      }

      .logo h1 {
        font-size: clamp(42px, 7vw, 68px);

        font-weight: 800;

        letter-spacing: -2px;

        color: #211c1e;
      }

      .logo h1 span {
        color: #e98ca5;
      }

      .logo p {
        margin-top: 5px;

        color: #806c73;

        font-size: 16px;

        font-weight: 500;
      }

      /* =====================================================
     COURSE MENU
  ===================================================== */

      .menu {
        display: flex;

        flex-direction: column;

        gap: 20px;

        align-items: center;
      }

      /* =====================================================
     COURSE BUTTON
  ===================================================== */

      .btn {
        width: 370px;

        min-height: 72px;

        display: flex;

        justify-content: center;

        align-items: center;

        text-decoration: none;

        font-size: 24px;

        font-weight: 700;

        border-radius: 18px;

        transition: all 0.3s ease;

        position: relative;

        overflow: hidden;

        border: 2px solid transparent;
      }

      .btn::before {
        content: "";

        position: absolute;

        width: 100px;
        height: 100px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.12);

        top: -50px;
        right: -30px;

        transition: transform 0.3s ease;
      }

      .btn:hover {
        transform: translateY(-6px) scale(1.02);

        box-shadow: 0 15px 30px rgba(33, 28, 30, 0.15);
      }

      .btn:hover::before {
        transform: scale(1.5);
      }

      /* =====================================================
     DARK BUTTON
  ===================================================== */

      .btn-dark {
        background: #211c1e;

        color: #f7c5d3;

        border-color: #211c1e;
      }

      .btn-dark:hover {
        background: #30282b;
      }

      /* =====================================================
     LIGHT BUTTON
  ===================================================== */

      .btn-light {
        background: #f4e8eb;

        color: #211c1e;

        border-color: #ead2d9;
      }

      .btn-light:hover {
        background: #f8dce4;
      }

      /* =====================================================
     PINK BUTTON
  ===================================================== */

      .btn-pink {
        background: #f7c5d3;

        color: #211c1e;

        border-color: #efadbf;
      }

      .btn-pink:hover {
        background: #f1aec1;
      }

      /* =====================================================
     MOBILE
  ===================================================== */

      @media (max-width: 700px) {
        body {
          padding: 100px 20px 40px;
        }

        .shopping {
          top: 15px;
          left: 15px;

          padding: 8px 12px;

          font-size: 12px;
        }

        .account-menu {
          top: 60px;

          right: 15px;
          left: 15px;

          justify-content: center;

          gap: 6px;
        }

        .account-btn {
          padding: 8px 11px;

          font-size: 12px;
        }

        .main {
          width: 100%;

          gap: 25px;
        }

        .logo h1 {
          font-size: 45px;
        }

        .logo p {
          font-size: 14px;
        }

        .menu {
          width: 100%;

          gap: 16px;
        }

        .btn {
          width: min(330px, 100%);

          min-height: 65px;

          font-size: 21px;

          border-radius: 15px;
        }
      }

      /* =====================================================
     SMALL MOBILE
  ===================================================== */

      @media (max-width: 400px) {
        .logo h1 {
          font-size: 38px;
        }

        .account-menu {
          flex-wrap: wrap;
        }

        .account-btn {
          font-size: 11px;

          padding: 7px 9px;
        }

        .btn {
          font-size: 19px;
        }
      }
    </style>
