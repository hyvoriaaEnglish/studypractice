    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        background: white;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
      }

      /* =========================
     NỀN HỒNG
  ========================= */

      body::before {
        content: "";
        position: absolute;
        left: -180px;
        bottom: -120px;
        width: 900px;
        height: 260px;
        background: #f8c8d0;
        transform: rotate(12deg);
      }

      /* =========================
     NÚT ĐĂNG NHẬP / ĐĂNG KÝ
  ========================= */

      .account-menu {
        position: absolute;
        top: 25px;
        right: 30px;
        z-index: 10;

        display: flex;
        align-items: center;
        gap: 12px;
      }

      .account-btn {
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 15px;
        transition: 0.3s;
      }

      .login-btn {
        color: #211c1e;
        border: 1px solid #211c1e;
        background: white;
      }

      .register-btn {
        color: white;
        background: #211c1e;
        border: 1px solid #211c1e;
      }

      .account-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
      }

      /* =========================
     SHOPPING
  ========================= */

      .shopping {
        position: absolute;
        top: 25px;
        left: 30px;
        z-index: 10;

        text-decoration: none;
        color: #211c1e;
        font-size: 15px;
      }

      .shopping:hover {
        text-decoration: underline;
      }

      /* =========================
     KHỐI MENU
  ========================= */

      .menu {
        display: flex;
        flex-direction: column;
        gap: 35px;
        z-index: 2;
      }

      /* =========================
     CÁC NÚT KHÓA HỌC
  ========================= */

      .btn {
        width: 360px;
        height: 72px;

        display: flex;
        justify-content: center;
        align-items: center;

        text-decoration: none;
        font-size: 26px;
        font-weight: 300;

        transition: 0.3s;
      }

      .btn-dark {
        background: #211c1e;
        color: #f2c8d0;
      }

      .btn-light {
        background: #ece7e7;
        color: #222;
      }

      .btn-pink {
        background: #fdf1f3;
        color: #ea8ca2;
      }

      .btn:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
      }

      /* =========================
     RESPONSIVE CHO ĐIỆN THOẠI
  ========================= */

      @media (max-width: 600px) {
        .account-menu {
          top: 15px;
          right: 15px;
        }

        .shopping {
          top: 15px;
          left: 15px;
        }

        .account-btn {
          padding: 8px 12px;
          font-size: 13px;
        }

        .btn {
          width: 300px;
          height: 65px;
          font-size: 21px;
        }
      }
    </style>
