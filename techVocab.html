<!doctype html>

      rel="stylesheet"
    />

    <style>
      :root {
        --bg-color: #fdfbf7;
        --card-bg: #ffffff;
        --text-main: #4a3e3d;
        --text-muted: #8c7a6b;
        --primary: #d97736;
        --primary-hover: #b85b1e;
        --border-color: #f3e5d8;
        --accent-yellow: #fff3c4;
        --accent-bg: #fdf6ed;
        --shadow: 0 8px 20px rgba(184, 91, 30, 0.06);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Nunito", sans-serif;
        background-color: var(--bg-color);
        background-image: radial-gradient(#e5d3be 0.75px, transparent 0.75px);
        background-size: 16px 16px;
        color: var(--text-main);
        line-height: 1.6;
        padding: 40px 20px;
        min-height: 100vh;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
      }

      .back-nav {
        margin-bottom: 20px;
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--primary);
        text-decoration: none;
        font-weight: 700;
        transition: color 0.2s;
      }

      .back-btn:hover {
        color: var(--primary-hover);
      }

      header {
        text-align: center;
        margin-bottom: 30px;
      }

      header .sub-title {
        font-family: "Caveat", cursive;
        font-size: 1.6rem;
        color: var(--primary);
        margin-bottom: 4px;
      }

      header h1 {
        font-family: "Lora", serif;
        color: var(--text-main);
        font-size: 2.2rem;
        margin-bottom: 8px;
        font-weight: 600;
      }

      header p {
        color: var(--text-muted);
        font-size: 1rem;
      }

      /* Control Panel: Search & Filter */
      .controls {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 20px 24px;
        margin-bottom: 30px;
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        justify-content: space-between;
        align-items: center;
        box-shadow: var(--shadow);
      }

      .search-box {
        flex: 1;
        min-width: 250px;
      }

      .search-box input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        font-family: "Nunito", sans-serif;
        font-size: 0.95rem;
        outline: none;
        background-color: var(--bg-color);
        color: var(--text-main);
      }

      .search-box input:focus {
        border-color: var(--primary);
        background-color: #fff;
      }

      .filter-tags {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .tag-btn {
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 8px 14px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .tag-btn:hover,
      .tag-btn.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      /* Grid Cards */
      .vocab-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
      }

      /* Flashcard Container */
      .card-container {
        perspective: 1000px;
        height: 220px;
      }

      .flashcard {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        cursor: pointer;
      }

      .flashcard.flipped {
        transform: rotateY(180deg);
      }

      .card-front,
      .card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 18px;
        border: 1px solid var(--border-color);
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: var(--shadow);
      }

      .card-front {
        background-color: var(--card-bg);
      }

      .card-back {
        background-color: var(--accent-bg);
        transform: rotateY(180deg);
      }

      .category-badge {
        font-size: 0.75rem;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 700;
      }

      .word-title {
        font-family: "Lora", serif;
        font-size: 1.4rem;
        color: var(--primary-hover);
        margin-top: 5px;
        font-weight: 600;
      }

      .phonetic {
        font-size: 0.9rem;
        color: var(--text-muted);
        font-style: italic;
      }

      .audio-btn {
        align-self: flex-start;
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 50%;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
      }

      .audio-btn:hover {
        background: var(--primary);
        color: #fff;
      }

      .meaning {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 8px;
      }

      .type-tag {
        font-size: 0.8rem;
        font-style: italic;
        color: var(--text-muted);
      }

      .hint-text {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-align: right;
      }

      @media (max-width: 600px) {
        .controls {
          flex-direction: column;
          align-items: stretch;
        }
        .filter-tags {
          justify-content: center;
        }
      }
    </style>
  </head>

      let currentCategory = "all";

      function renderCards(data) {
        const grid = document.getElementById("vocabGrid");
        grid.innerHTML = data
          .map(
            (item) => `
        <div class="card-container">
            <div class="flashcard" onclick="flipCard(this)">
                <!-- Mặt trước thẻ -->
                <div class="card-front">
                    <div>
                        <span class="category-badge">${item.category}</span>
                        <div class="word-title">${item.word}</div>
                        <div class="phonetic">${item.phonetic}</div>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <button class="audio-btn" onclick="speakWord(event, '${item.word}')" title="Phát âm">🔊</button>
                        <span class="hint-text">Xem nghĩa ↻</span>
                    </div>
                </div>
                <!-- Mặt sau thẻ -->
                <div class="card-back">
                    <div>
                        <span class="category-badge">${item.category}</span>
                        <div class="meaning">${item.meaning}</div>
                        <span class="type-tag">Loại từ: (${item.pos})</span>
                    </div>
                    <div class="hint-text">Lật lại ↻</div>
                </div>
            </div>
        </div>
    `,
          )
          .join("");
      }

      function flipCard(card) {
        card.classList.toggle("flipped");
      }

      function speakWord(event, word) {
        event.stopPropagation();
        if ("speechSynthesis" in window) {
          const utterance = new SpeechSynthesisUtterance(word);
          utterance.lang = "en-US";
          window.speechSynthesis.speak(utterance);
        }
      }

      function setCategory(cat, btn) {
        currentCategory = cat;
        document
          .querySelectorAll(".tag-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        filterWords();
      }

      function filterWords() {
        const query = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const filtered = vocabulary.filter((item) => {
          const matchesCat =
            currentCategory === "all" || item.category === currentCategory;
          const matchesQuery =
            item.word.toLowerCase().includes(query) ||
            item.meaning.toLowerCase().includes(query);
          return matchesCat && matchesQuery;
        });
        renderCards(filtered);
      }

      renderCards(vocabulary);
    </script>
  </body>
</html>
