<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nature Vocabulary</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          Segoe UI,
          sans-serif;
      }

      body {
        background: linear-gradient(135deg, #c9f7e5, #d7ecff);
        padding: 40px;
      }

      .container {
        max-width: 1100px;
        margin: auto;
      }

      h1 {
        text-align: center;
        color: #0b4f6c;
        margin-bottom: 10px;
      }

      .subtitle {
        text-align: center;
        margin-bottom: 30px;
        color: #444;
      }

      .search {
        display: flex;
        justify-content: center;
        margin-bottom: 30px;
      }

      .search input {
        width: 400px;
        max-width: 90%;
        padding: 14px;
        border: none;
        border-radius: 30px;
        font-size: 17px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        outline: none;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
        gap: 20px;
      }

      .card {
        background: white;
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        transition: 0.3s;
      }

      .card:hover {
        transform: translateY(-6px);
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .word {
        font-size: 27px;
        font-weight: bold;
        color: #00695c;
      }

      button {
        border: none;
        background: #009688;
        color: white;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 20px;
        transition: 0.3s;
      }

      button:hover {
        background: #00796b;
        transform: scale(1.08);
      }

      .meaning {
        font-size: 18px;
        font-weight: bold;
        color: #1565c0;
        margin-bottom: 10px;
      }

      .example {
        font-style: italic;
        margin-bottom: 8px;
        color: #333;
      }

      .translation {
        color: #666;
      }

      .footer {
        margin-top: 35px;
        text-align: center;
        color: #555;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Vocabulary</h1>
      <p class="subtitle">Click 🔊 to hear the pronunciation.</p>

      <div class="search">
        <input id="search" placeholder="Search vocabulary..." />
      </div>

      <div class="grid" id="grid"></div>

      <div class="footer">Made for English Learning ❤️</div>
    </div>

    <script>
      const words = [
        {
          word: "3D printer",
          meaning: "máy in 3D",
          example: "A 3D printer can create objects layer by layer.",
          translation: "Máy in 3D có thể tạo ra các vật thể theo từng lớp.",
        },

        {
          word: "aluminum",
          meaning: "nhôm",
          example: "This bicycle is made of aluminum.",
          translation: "Chiếc xe đạp này được làm bằng nhôm.",
        },

        {
          word: "camcorder",
          meaning: "máy quay phim",
          example: "She recorded the concert with her camcorder.",
          translation: "Cô ấy quay buổi hòa nhạc bằng máy quay phim.",
        },

        {
          word: "cardboard",
          meaning: "bìa các-tông",
          example: "The box is made of cardboard.",
          translation: "Chiếc hộp được làm bằng bìa các-tông.",
        },

        {
          word: "copper",
          meaning: "đồng",
          example: "Copper is widely used for electrical wires.",
          translation: "Đồng được sử dụng rộng rãi để làm dây điện.",
        },

        {
          word: "e-reader",
          meaning: "máy đọc sách điện tử",
          example: "I enjoy reading novels on my e-reader.",
          translation: "Tôi thích đọc tiểu thuyết trên máy đọc sách điện tử.",
        },

        {
          word: "leaflet",
          meaning: "tờ rơi",
          example: "The volunteers handed out leaflets.",
          translation: "Các tình nguyện viên phát tờ rơi.",
        },

        {
          word: "plastic",
          meaning: "nhựa",
          example: "Plastic bottles should be recycled.",
          translation: "Chai nhựa nên được tái chế.",
        },

        {
          word: "portable",
          meaning: "có thể mang theo",
          example: "This speaker is small and portable.",
          translation: "Chiếc loa này nhỏ gọn và dễ mang theo.",
        },

        {
          word: "portable music player",
          meaning: "máy nghe nhạc cầm tay",
          example: "He always carries a portable music player.",
          translation: "Anh ấy luôn mang theo một máy nghe nhạc cầm tay.",
        },

        {
          word: "robotic vacuum cleaner",
          meaning: "máy hút bụi robot",
          example: "The robotic vacuum cleaner cleans the floor automatically.",
          translation: "Máy hút bụi robot tự động làm sạch sàn nhà.",
        },

        {
          word: "rubber",
          meaning: "cao su",
          example: "The tires are made of rubber.",
          translation: "Những chiếc lốp được làm bằng cao su.",
        },

        {
          word: "self-portrait",
          meaning: "tranh/chân dung tự họa",
          example: "The artist painted a beautiful self-portrait.",
          translation: "Người họa sĩ đã vẽ một bức chân dung tự họa đẹp.",
        },

        {
          word: "smartwatch",
          meaning: "đồng hồ thông minh",
          example: "My smartwatch tracks my heart rate.",
          translation: "Đồng hồ thông minh của tôi theo dõi nhịp tim.",
        },

        {
          word: "steel",
          meaning: "thép",
          example: "The bridge is built from steel.",
          translation: "Cây cầu được xây bằng thép.",
        },

        {
          word: "stylish",
          meaning: "thời trang, sành điệu",
          example: "She bought a stylish backpack.",
          translation: "Cô ấy mua một chiếc ba lô rất thời trang.",
        },

        {
          word: "suck",
          meaning: "hút",
          example: "The vacuum cleaner can suck up dust quickly.",
          translation: "Máy hút bụi có thể hút bụi rất nhanh.",
        },

        {
          word: "touchscreen",
          meaning: "màn hình cảm ứng",
          example: "This tablet has a large touchscreen.",
          translation: "Chiếc máy tính bảng này có màn hình cảm ứng lớn.",
        },

        {
          word: "virtual",
          meaning: "ảo, trực tuyến",
          example: "Students attended a virtual classroom.",
          translation: "Học sinh tham gia một lớp học trực tuyến.",
        },

        {
          word: "window shade",
          meaning: "rèm cửa",
          example: "She pulled down the window shade.",
          translation: "Cô ấy kéo rèm cửa xuống.",
        },

        {
          word: "wireless",
          meaning: "không dây",
          example: "Wireless headphones are very convenient.",
          translation: "Tai nghe không dây rất tiện lợi.",
        },
      ];
      const grid = document.getElementById("grid");

      function render(list) {
        grid.innerHTML = "";

        list.forEach((item) => {
          grid.innerHTML += `

<div class="card">

<div class="top">

<div class="word">${item.word}</div>

<button onclick="speak('${item.word}')">🔊</button>

</div>

<div class="meaning">${item.meaning}</div>

<div class="example">${item.example}</div>

<div class="translation">${item.translation}</div>

</div>

`;
        });
      }

      render(words);

      document.getElementById("search").addEventListener("input", function () {
        const value = this.value.toLowerCase();

        render(
          words.filter(
            (v) =>
              v.word.toLowerCase().includes(value) ||
              v.meaning.toLowerCase().includes(value),
          ),
        );
      });

      function speak(text) {
        speechSynthesis.cancel();

        const utter = new SpeechSynthesisUtterance(text);

        utter.lang = "en-US";

        utter.rate = 0.9;

        speechSynthesis.speak(utter);
      }
    </script>
  </body>
</html>
