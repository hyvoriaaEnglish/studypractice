<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học 50 Từ Vựng Kinh Tế (Economics)</title>
    <style>
      :root {
        --primary: #f59e0b;
        --primary-dark: #d97706;
        --primary-light: #fef3c7;
        --bg-gradient: linear-gradient(
          135deg,
          #fffbeb 0%,
          #fef3c7 50%,
          #fde68a 100%
        );
        --card-bg: #ffffff;
        --text-main: #78350f;
        --text-sub: #92400e;
        --text-dark: #1f2937;
        --text-muted: #6b7280;
        --border-color: #fde68a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Segoe UI",
          -apple-system,
          BlinkMacSystemFont,
          Roboto,
          sans-serif;
        background: var(--bg-gradient);
        color: var(--text-dark);
        min-height: 100vh;
        padding: 24px 16px;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 30px;
        background: var(--card-bg);
        padding: 28px 20px;
        border-radius: 20px;
        box-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.15);
        border: 1px solid var(--border-color);
      }

      h1 {
        color: var(--primary-dark);
        font-size: 2rem;
        margin-bottom: 8px;
      }

      p.subtitle {
        color: var(--text-sub);
        font-size: 1rem;
      }

      .search-box {
        margin-top: 20px;
        position: relative;
      }

      .search-box input {
        width: 100%;
        padding: 12px 20px;
        border: 2px solid var(--border-color);
        border-radius: 12px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s;
      }

      .search-box input:focus {
        border-color: var(--primary-dark);
      }

      .vocab-list {
        display: grid;
        gap: 16px;
      }

      .vocab-card {
        background: var(--card-bg);
        border-radius: 16px;
        padding: 20px 24px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--border-color); /* Đã sửa lỗi mã màu Hex */
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .vocab-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -3px rgba(217, 119, 6, 0.15);
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        flex-wrap: wrap;
        gap: 8px;
      }

      .word-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .word {
        font-size: 1.35rem;
        font-weight: 700;
        color: var(--primary-dark);
      }

      .pos {
        font-size: 0.85rem;
        font-weight: 600;
        font-style: italic;
        color: #b45309;
        background: var(--primary-light);
        padding: 2px 8px;
        border-radius: 6px;
      }

      .btn-audio {
        background: var(--primary-light);
        border: 1px solid #fde68a;
        color: var(--primary-dark);
        width: 38px;
        height: 38px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
      }

      .btn-audio:hover {
        background: var(--primary);
        color: #ffffff;
        transform: scale(1.08);
      }

      .btn-audio svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }

      .meaning {
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 12px;
      }

      .example-box {
        background: #fffbeb;
        border-left: 4px solid var(--primary);
        padding: 10px 14px;
        border-radius: 0 8px 8px 0;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .example-en {
        color: #451a03;
        margin-bottom: 4px;
      }

      .example-vi {
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      @media (max-width: 600px) {
        body {
          padding: 12px 8px;
        }
        .vocab-card {
          padding: 16px;
        }
        .word {
          font-size: 1.15rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>50 Từ Vựng Kinh Tế (Economics)</h1>
        <p class="subtitle">
          Bấm vào biểu tượng loa để nghe phát âm từ vựng và câu ví dụ
        </p>
        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            placeholder="Tìm kiếm từ vựng hoặc nghĩa tiếng Việt..."
            onkeyup="filterVocab()"
          />
        </div>
      </header>

      <div class="vocab-list" id="vocabContainer"></div>
    </div>

    <script>

        {

        {

        {

          vi: "Giá cân bằng xuất hiện khi cung bằng cầu.",
        },
        {
          word: "Scarcity",
          pos: "n",
          meaning: "Sự khan hiếm",

          vi: "Sự khan hiếm nguyên liệu thô đã dẫn đến chi phí sản xuất cao hơn.",
        },
        {
          word: "Opportunity cost",
          pos: "n",
          meaning: "Chi phí cơ hội",

          vi: "Việc lựa chọn một phương án luôn đi kèm với chi phí cơ hội.",

        {

        {

        },
        {
          word: "Commodity",
          pos: "n",
          meaning: "Hàng hóa / Thương phẩm",

        },
        {
          word: "Capital",
          pos: "n",
          meaning: "Vốn đầu tư / Vốn kinh doanh",
          en: "They need more capital to expand their business.",
          vi: "Họ cần thêm vốn để mở rộng việc kinh doanh.",
        },
        {

          pos: "n",

        {

        },
        {
          word: "Equity",
          pos: "n",
          meaning: "Vốn chủ sở hữu / Giá trị ròng",
          en: "The founders retain majority equity in the company.",
          vi: "Các nhà sáng lập giữ phần lớn vốn chủ sở hữu trong công ty.",
        },
        {
          word: "Stock market",
          pos: "n",
          meaning: "Thị trường chứng khoán",
          en: "Investors closely watch the stock market every day.",
          vi: "Nhà đầu tư theo dõi sát sao thị trường chứng khoán mỗi ngày.",
        },
        {
          word: "Bond",
          pos: "n",
          meaning: "Trái phiếu",
          en: "Government bonds are usually low-risk investments.",
          vi: "Trái phiếu chính phủ thường là khoản đầu tư rủi ro thấp.",
        },
        {
          word: "Dividend",
          pos: "n",
          meaning: "Cổ tức",
          en: "Shareholders received a quarterly dividend payout.",
          vi: "Các cổ đông đã nhận được khoản chi trả cổ tức hàng quý.",
        },
        {
          word: "Liquidity",
          pos: "n",
          meaning: "Tính thanh khoản",
          en: "Cash has the highest liquidity among all assets.",
          vi: "Tiền mặt có tính thanh khoản cao nhất trong tất cả tài sản.",
        },
        {
          word: "Speculation",
          pos: "n",
          meaning: "Sự đầu cơ",
          en: "Property speculation drove housing prices to extreme levels.",
          vi: "Sự đầu cơ bất động sản đã đẩy giá nhà lên mức cực cao.",
        },
        {
          word: "Import",
          pos: "n/v",
          meaning: "Nhập khẩu",
          en: "The country imports most of its crude oil.",
          vi: "Quốc gia này nhập khẩu phần lớn dầu thô.",
        },
        {
          word: "Export",
          pos: "n/v",
          meaning: "Xuất khẩu",

        {

          meaning: "Tiền trợ cấp",

        },
        {
          word: "Revenue",
          pos: "n",
          meaning: "Doanh thu",
          en: "The company reported record revenue this quarter.",
          vi: "Công ty báo cáo doanh thu kỷ lục trong quý này.",
        },
        {
          word: "Profit",
          pos: "n",
          meaning: "Lợi nhuận",
          en: "Net profit increased by 15% year-over-year.",
          vi: "Lợi nhuận ròng tăng 15% so với cùng kỳ năm ngoái.",

        {
          word: "Loss",
          pos: "n",
          meaning: "Khoản thua lỗ",

          pos: "n",

          pos: "n",
          meaning: "Hệ thống thuế / Việc đánh thuế",
          en: "Fair taxation funds public infrastructure and schools.",
          vi: "Hệ thống thuế công bằng tài trợ cho cơ sở hạ tầng và trường học.",

          pos: "n",

        },

      function renderVocab(data) {
        const container = document.getElementById("vocabContainer");
        container.innerHTML = data
          .map(
            (item, index) => `
        <div class="vocab-card">
            <div class="card-header">
                <div class="word-group">
                    <span class="word">${item.word}</span>
                    <span class="pos">${item.pos}</span>
                </div>
                <button class="btn-audio" onclick="speakText('${item.word.replace(/'/g, "\\'")}')" title="Nghe phát âm từ">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
            </div>
            <div class="meaning">👉 ${item.meaning}</div>
            <div class="example-box">
                <div class="example-en">💬 <i>"${item.en}"</i></div>
                <div class="example-vi">💡 ${item.vi}</div>
            </div>
        </div>
    `,
          )
          .join("");
      }

      function speakText(text) {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel(); // Stop any ongoing speech
          const cleanText = text.replace(/\s*\(.*?\)\s*/g, ""); // Bỏ ngoặc đơn khi đọc
          const utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.lang = "en-US";
          utterance.rate = 0.9; // Tốc độ đọc vừa phải
          window.speechSynthesis.speak(utterance);
        } else {
          alert("Trình duyệt của bạn không hỗ trợ tính năng phát âm.");
        }
      }

      function filterVocab() {
        const keyword = document
          .getElementById("searchInput")
          .value.toLowerCase()
          .trim();
        const filtered = vocabData.filter(
          (item) =>
            item.word.toLowerCase().includes(keyword) ||
            item.meaning.toLowerCase().includes(keyword) ||
            item.en.toLowerCase().includes(keyword),
        );
        renderVocab(filtered);
      }

      // Initial render
      renderVocab(vocabData);
    </script>
  </body>
</html>
