<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <!-- Giúp giao diện hiển thị đẹp trên điện thoại -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>THPTQG</title>

    <style>
      /* ==================================================
       1. RESET CSS
    ================================================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* ==================================================
       2. BODY
    ================================================== */

      body {
        width: 100%;
        min-height: 100vh;

        background-color: #ffffff;

        font-family: Arial, Helvetica, sans-serif;

        overflow-x: hidden;

        position: relative;
      }

      /* ==================================================
       3. KHU VỰC CHỨA TẤT CẢ NGÔI SAO
    ================================================== */

      .stars {
        position: fixed;

        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        pointer-events: none;

        z-index: 1;
      }

      /* ==================================================
       4. NGÔI SAO
    ================================================== */

      .star {
        position: absolute;

        color: #f5a9b7;

        opacity: 0.55;

        font-size: 30px;

        animation: floating 4s ease-in-out infinite;
      }

      /* Ngôi sao số 1 */

      .star:nth-child(1) {
        top: -15px;
        left: 7%;

        font-size: 45px;
      }

      /* Ngôi sao số 2 */

      .star:nth-child(2) {
        top: 7%;
        left: 25%;

        font-size: 30px;
      }

      /* Ngôi sao số 3 */

      .star:nth-child(3) {
        top: 2%;
        left: 47%;

        font-size: 28px;
      }

      /* Ngôi sao số 4 */

      .star:nth-child(4) {
        top: 7%;
        right: 25%;

        font-size: 30px;
      }

      /* Ngôi sao số 5 */

      .star:nth-child(5) {
        top: 15%;
        right: 6%;

        font-size: 38px;
      }

      /* Ngôi sao số 6 */

      .star:nth-child(6) {
        top: 31%;
        left: 20%;

        font-size: 40px;
      }

      /* Ngôi sao số 7 */

      .star:nth-child(7) {
        top: 33%;
        right: 16%;

        font-size: 28px;
      }

      /* Ngôi sao số 8 */

      .star:nth-child(8) {
        top: 58%;
        left: 2%;

        font-size: 46px;
      }

      /* Ngôi sao số 9 */

      .star:nth-child(9) {
        top: 64%;
        right: 12%;

        font-size: 43px;
      }

      /* Ngôi sao số 10 */

      .star:nth-child(10) {
        bottom: 13%;
        left: 30%;

        font-size: 28px;
      }

      /* Ngôi sao số 11 */

      .star:nth-child(11) {
        bottom: 3%;
        left: 48%;

        font-size: 40px;
      }

      /* Ngôi sao số 12 */

      .star:nth-child(12) {
        bottom: 7%;
        right: 24%;

        font-size: 25px;
      }

      /* Ngôi sao số 13 */

      .star:nth-child(13) {
        bottom: 8%;
        right: 8%;

        font-size: 25px;
      }

      /* ==================================================
       5. HIỆU ỨNG CHUYỂN ĐỘNG CHO NGÔI SAO
    ================================================== */

      @keyframes floating {
        0% {
          transform: translateY(0px);
        }

        50% {
          transform: translateY(-7px);
        }

        100% {
          transform: translateY(0px);
        }
      }

      /* ==================================================
       6. KHU VỰC CHÍNH
    ================================================== */

      .container {
        position: relative;

        z-index: 10;

        width: 100%;

        min-height: 100vh;

        display: flex;

        flex-direction: column;

        align-items: center;

        padding-top: 60px;

        gap: 52px;
      }

      /* ==================================================
       7. CÁC Ô LINK
    ================================================== */

      .link-box {
        width: 260px;

        height: 112px;

        background-color: #f8c8cc;

        display: flex;

        align-items: center;

        justify-content: center;

        text-decoration: none;

        color: #222222;

        font-size: 32px;

        font-weight: 400;

        transition: all 0.3s ease;
      }

      /* ==================================================
       8. HIỆU ỨNG KHI DI CHUỘT VÀO Ô LINK
    ================================================== */

      .link-box:hover {
        transform: scale(1.05);

        background-color: #f5b9c0;

        box-shadow: 0 8px 20px rgba(240, 150, 165, 0.25);
      }

      /* ==================================================
       9. Ô "..."
    ================================================== */

      .more-box {
        width: 130px;

        height: 123px;

        background-color: #f8c8cc;

        display: flex;

        align-items: center;

        justify-content: center;

        text-decoration: none;

        color: #222222;

        font-size: 32px;

        transition: all 0.3s ease;
      }

      /* Hiệu ứng hover */

      .more-box:hover {
        transform: scale(1.05);

        background-color: #f5b9c0;

        box-shadow: 0 8px 20px rgba(240, 150, 165, 0.25);
      }

      /* ==================================================
       10. RESPONSIVE - ĐIỆN THOẠI
    ================================================== */

      @media (max-width: 600px) {
        .container {
          padding-top: 40px;

          gap: 35px;
        }

        .link-box {
          width: 230px;

          height: 90px;

          font-size: 27px;
        }

        .more-box {
          width: 110px;

          height: 100px;
        }

        .star {
          transform: scale(0.8);
        }
      }
    </style>
  </head>

  <body>
    <!-- ==================================================
       PHẦN NGÔI SAO TRANG TRÍ
  ================================================== -->

    <div class="stars">
      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>
    </div>

    <!-- ==================================================
       PHẦN NỘI DUNG CHÍNH
  ================================================== -->

    <main class="container">
      <!-- ==================================================
         Ô LINK 1
    ================================================== -->

      <a href="conv.html" class="link-box"> Phần hội thoại </a>

      <!-- ==================================================
         Ô LINK 2
    ================================================== -->

      <a href="guidedcloze.html" class="link-box"> Phần bài đọc điền từ </a>

      <!-- ==================================================
         Ô LINK 3
    ================================================== -->

      <a href="readqg.html" class="link-box"> Phần đọc hiểu 10 câu </a>
    </main>

    <!-- ==================================================
       JAVASCRIPT
  ================================================== -->

    <script>
      // Lấy tất cả các ô link

      const linkBoxes = document.querySelectorAll(".link-box, .more-box");

      // Thêm hiệu ứng khi click

      linkBoxes.forEach(function (box) {
        box.addEventListener("click", function () {
          console.log("Bạn vừa click vào:", this.innerText);
        });
      });
    </script>
  </body>
</html>
