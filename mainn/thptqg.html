    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>THPTQG</title>

    <style>
      /* =====================================================
     RESET
  ===================================================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* =====================================================
     BODY
  ===================================================== */

      body {
        min-height: 100vh;

        font-family: "Segoe UI", Arial, Helvetica, sans-serif;

        color: #5c4936;

        background:
          radial-gradient(
            circle at 10% 10%,
            rgba(255, 255, 255, 0.85),
            transparent 25%
          ),
          radial-gradient(
            circle at 90% 20%,
            rgba(255, 255, 255, 0.7),
            transparent 25%
          ),
          linear-gradient(135deg, #fff1c9 0%, #ffe0ad 45%, #ffd0b5 100%);

        overflow-x: hidden;

        position: relative;
      }

      /* =====================================================
     DECORATIVE BACKGROUND CIRCLES
  ===================================================== */

      body::before {
        content: "";

        position: fixed;

        width: 260px;
        height: 260px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.25);

        top: -80px;
        right: -70px;

        pointer-events: none;
      }

      body::after {
        content: "";

        position: fixed;

        width: 200px;
        height: 200px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.25);

        bottom: -70px;
        left: -60px;

        pointer-events: none;
      }

      /* =====================================================
     STARS / DECORATION
  ===================================================== */

      .stars {
        position: fixed;

        inset: 0;

        width: 100%;
        height: 100%;

        pointer-events: none;

        z-index: 1;
      }

      .star {
        position: absolute;

        color: #f2a65a;

        opacity: 0.45;

        font-size: 30px;

        animation: floating 4s ease-in-out infinite;
      }

      .star:nth-child(1) {
        top: 5%;
        left: 8%;

        font-size: 42px;
      }

      .star:nth-child(2) {
        top: 12%;
        left: 25%;

        font-size: 25px;
      }

      .star:nth-child(3) {
        top: 4%;
        left: 48%;

        font-size: 30px;
      }

      .star:nth-child(4) {
        top: 10%;
        right: 25%;

        font-size: 24px;
      }

      .star:nth-child(5) {
        top: 18%;
        right: 7%;

        font-size: 40px;
      }

      .star:nth-child(6) {
        top: 35%;
        left: 10%;

        font-size: 28px;
      }

      .star:nth-child(7) {
        top: 40%;
        right: 12%;

        font-size: 35px;
      }

      .star:nth-child(8) {
        top: 62%;
        left: 5%;

        font-size: 40px;
      }

      .star:nth-child(9) {
        top: 65%;
        right: 7%;

        font-size: 30px;
      }

      .star:nth-child(10) {
        bottom: 15%;
        left: 25%;

        font-size: 25px;
      }

      .star:nth-child(11) {
        bottom: 5%;
        left: 48%;

        font-size: 38px;
      }

      .star:nth-child(12) {
        bottom: 10%;
        right: 25%;

        font-size: 25px;
      }

      .star:nth-child(13) {
        bottom: 7%;
        right: 8%;

        font-size: 30px;
      }

      /* =====================================================
     FLOATING ANIMATION
  ===================================================== */

      @keyframes floating {
        0% {
          transform: translateY(0px) rotate(0deg);
        }

        50% {
          transform: translateY(-8px) rotate(5deg);
        }

        100% {
          transform: translateY(0px) rotate(0deg);
        }
      }

      /* =====================================================
     MAIN CONTAINER
  ===================================================== */

      .container {
        position: relative;

        z-index: 10;

        width: 92%;

        max-width: 850px;

        min-height: 100vh;

        margin: 0 auto;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        padding: 60px 20px 70px;

        gap: 25px;
      }

      /* =====================================================
     HEADER
  ===================================================== */

      .header {
        text-align: center;

        margin-bottom: 15px;
      }

      .header h1 {
        display: inline-block;

        padding: 14px 30px;

        border-radius: 22px;

        background: rgba(255, 255, 255, 0.75);

        backdrop-filter: blur(10px);

        border: 2px solid rgba(255, 255, 255, 0.8);

        box-shadow: 0 10px 30px rgba(180, 120, 50, 0.12);

        font-size: clamp(38px, 6vw, 58px);

        font-weight: 800;

        background: linear-gradient(90deg, #e98b35, #f2a65a, #e9b949);

        -webkit-background-clip: text;

        -webkit-text-fill-color: transparent;

        background-clip: text;
      }

      .header p {
        margin-top: 10px;

        color: #876d4f;

        font-size: 18px;

        font-weight: 600;
      }

      /* =====================================================
     LINK BOX
  ===================================================== */

      .link-box {
        width: 100%;

        max-width: 480px;

        min-height: 105px;

        padding: 20px 30px;

        display: flex;

        align-items: center;

        justify-content: center;

        text-align: center;

        text-decoration: none;

        border-radius: 25px;

        font-size: 28px;

        font-weight: 800;

        color: #654b32;

        position: relative;

        overflow: hidden;

        border: 2px solid rgba(255, 255, 255, 0.7);

        box-shadow: 0 12px 30px rgba(180, 120, 50, 0.13);

        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      /* =====================================================
     DECORATIVE CIRCLES INSIDE BOX
  ===================================================== */

      .link-box::before {
        content: "";

        position: absolute;

        width: 120px;
        height: 120px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.35);

        top: -55px;
        right: -30px;

        transition: transform 0.3s ease;
      }

      .link-box::after {
        content: "";

        position: absolute;

        width: 65px;
        height: 65px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.3);

        bottom: -25px;
        left: -15px;
      }

      .link-box:hover {
        transform: translateY(-8px) scale(1.02);

        box-shadow: 0 20px 40px rgba(180, 120, 50, 0.2);
      }

      .link-box:hover::before {
        transform: scale(1.3);
      }

      /* =====================================================
     DIFFERENT COLORS
  ===================================================== */

      .link-box:nth-of-type(1) {
        background: linear-gradient(135deg, #ffd28f, #ffe8bd);
      }

      .link-box:nth-of-type(2) {
        background: linear-gradient(135deg, #ffb979, #ffd2a8);
      }

      .link-box:nth-of-type(3) {
        background: linear-gradient(135deg, #ffe09c, #fff0c7);
      }

      /* =====================================================
     RESPONSIVE - TABLET
  ===================================================== */

      @media (max-width: 700px) {
        .container {
          padding: 45px 15px 60px;
        }

        .header h1 {
          font-size: 42px;

          padding: 12px 25px;
        }

        .header p {
          font-size: 16px;
        }

        .link-box {
          max-width: 400px;

          min-height: 90px;

          font-size: 25px;
        }
      }

      /* =====================================================
     RESPONSIVE - MOBILE
  ===================================================== */

      @media (max-width: 500px) {
        .container {
          gap: 20px;

          justify-content: flex-start;

          padding-top: 50px;
        }

        .header {
          margin-bottom: 20px;
        }

        .header h1 {
          font-size: 36px;
        }

        .header p {
          font-size: 15px;
        }

        .link-box {
          min-height: 85px;

          font-size: 22px;

          border-radius: 22px;

          padding: 15px 20px;
        }

        .star {
          transform: scale(0.75);
        }
      }

      /* =====================================================
     SMALL MOBILE
  ===================================================== */

      @media (max-width: 350px) {
        .header h1 {
          font-size: 31px;
        }

        .link-box {
          font-size: 20px;

          min-height: 80px;
        }
      }
    </style>
