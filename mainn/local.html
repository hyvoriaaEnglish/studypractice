<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đề Chuyên Các Tỉnh Thành Phố</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* =====================================================
         RESET & VARIABLES
      ===================================================== */
      :root {
        --primary-pink: #f472b6;
        --soft-pink: #fbcfe8;
        --card-bg: rgba(255, 255, 255, 0.7);
        --card-border: rgba(244, 114, 182, 0.3);
        --text-color: #2d3748;
        --text-heading: #831843;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* =====================================================
         BODY & BACKGROUND
      ===================================================== */
      body {
        min-height: 100vh;
        background: #fdf2f8;
        background-image:
          radial-gradient(
            at 10% 10%,
            rgba(251, 207, 232, 0.8) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 90% 20%,
            rgba(244, 114, 182, 0.3) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 50% 80%,
            rgba(253, 226, 243, 0.9) 0px,
            transparent 50%
          );
        background-attachment: fixed;
        font-family: "Plus Jakarta Sans", sans-serif;
        color: var(--text-color);
        overflow-x: hidden;
        position: relative;
      }

      /* =====================================================
         NGÔI SAO TRANG TRÍ (FLOATING ANIMATION)
      ===================================================== */
      .stars {
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 1;
      }

      .star {
        position: absolute;
        color: #f472b6;
        opacity: 0.5;
        filter: drop-shadow(0 0 6px rgba(244, 114, 182, 0.6));
        animation: floatAndGlow 4s ease-in-out infinite alternate;
      }

      /* Vị trí & Delay cho hiệu ứng ngôi sao */
      .star:nth-child(1) {
        top: 5%;
        left: 8%;
        font-size: 28px;
        animation-delay: 0s;
      }
      .star:nth-child(2) {
        top: 12%;
        left: 28%;
        font-size: 18px;
        animation-delay: 0.5s;
      }
      .star:nth-child(3) {
        top: 4%;
        left: 52%;
        font-size: 22px;
        animation-delay: 1s;
      }
      .star:nth-child(4) {
        top: 10%;
        right: 22%;
        font-size: 20px;
        animation-delay: 1.5s;
      }
      .star:nth-child(5) {
        top: 18%;
        right: 7%;
        font-size: 32px;
        animation-delay: 0.2s;
      }
      .star:nth-child(6) {
        top: 35%;
        left: 12%;
        font-size: 24px;
        animation-delay: 2s;
      }
      .star:nth-child(7) {
        top: 38%;
        right: 14%;
        font-size: 18px;
        animation-delay: 1.2s;
      }
      .star:nth-child(8) {
        top: 60%;
        left: 5%;
        font-size: 30px;
        animation-delay: 0.8s;
      }
      .star:nth-child(9) {
        top: 68%;
        right: 8%;
        font-size: 26px;
        animation-delay: 2.2s;
      }
      .star:nth-child(10) {
        bottom: 15%;
        left: 25%;
        font-size: 20px;
        animation-delay: 1.7s;
      }
      .star:nth-child(11) {
        bottom: 5%;
        left: 50%;
        font-size: 28px;
        animation-delay: 0.3s;
      }
      .star:nth-child(12) {
        bottom: 8%;
        right: 28%;
        font-size: 18px;
        animation-delay: 2.5s;
      }
      .star:nth-child(13) {
        bottom: 12%;
        right: 6%;
        font-size: 22px;
        animation-delay: 1.1s;
      }

      @keyframes floatAndGlow {
        0% {
          transform: translateY(0) scale(1);
          opacity: 0.4;
        }
        100% {
          transform: translateY(-12px) scale(1.15);
          opacity: 0.8;
        }
      }

      /* =====================================================
         CONTAINER CHÍNH
      ===================================================== */
      .container {
        position: relative;
        z-index: 10;
        max-width: 960px;
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 60px 20px 80px;
      }

      /* =====================================================
         HEADER & TIÊU ĐỀ
      ===================================================== */
      .header-box {
        text-align: center;
        margin-bottom: 50px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 16px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid var(--card-border);
        border-radius: 30px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-heading);
        margin-bottom: 16px;
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 12px rgba(244, 114, 182, 0.12);
      }

      .title {
        font-family: "Playfair Display", serif;
        font-size: 42px;
        font-weight: 600;
        color: var(--text-heading);
        letter-spacing: -0.5px;
        line-height: 1.2;
      }

      .subtitle {
        margin-top: 10px;
        font-size: 15px;
        color: #9d4c6c;
        font-weight: 500;
      }

      /* =====================================================
         DANH SÁCH TỈNH THÀNH (GRID SYSTEM)
      ===================================================== */
      .grid-container {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
      }

      /* =====================================================
         CÁC Ô LINK (CARD DESIGN)
      ===================================================== */
      .link-box {
        position: relative;
        min-height: 95px;
        padding: 24px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-decoration: none;
        color: var(--text-heading);
        font-size: 20px;
        font-weight: 600;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 24px rgba(244, 114, 182, 0.08);
        transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        overflow: hidden;
      }

      .link-box::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          rgba(244, 114, 182, 0.15) 0%,
          rgba(251, 207, 232, 0.05) 100%
        );
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .link-text {
        position: relative;
        z-index: 2;
      }

      .arrow-icon {
        position: relative;
        z-index: 2;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(244, 114, 182, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-heading);
        font-size: 16px;
        transition: all 0.3s ease;
      }

      /* =====================================================
         HOVER EFFECTS
      ===================================================== */
      .link-box:hover {
        transform: translateY(-6px) scale(1.02);
        background: rgba(255, 255, 255, 0.9);
        border-color: rgba(244, 114, 182, 0.6);
        box-shadow: 0 16px 32px rgba(244, 114, 182, 0.2);
      }

      .link-box:hover::before {
        opacity: 1;
      }

      .link-box:hover .arrow-icon {
        background: var(--primary-pink);
        color: white;
        transform: translateX(4px);
      }

      /* =====================================================
         RESPONSIVE
      ===================================================== */
      @media (max-width: 600px) {
        .container {
          padding-top: 40px;
          padding-bottom: 50px;
        }

        .title {
          font-size: 30px;
        }

        .grid-container {
          grid-template-columns: 1fr;
          gap: 14px;
        }

        .link-box {
          min-height: 80px;
          padding: 18px 20px;
          font-size: 18px;
        }
      }
    </style>
  </head>

  <body>
    <!-- NGÔI SAO TRANG TRÍ -->
    <div class="stars">

      <div class="star">✦</div>
      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

        </a>

        <!-- NGHỆ AN -->
        <a href="NgheAn.html" class="link-box">
          <span class="link-text">Nghệ An</span>

        <!-- BẮC NINH -->
        <a href="BacNinh.html" class="link-box">

        </a>

        <!-- NINH BÌNH -->
        <a href="NinhBinh.html" class="link-box">

        <!-- HƯNG YÊN -->
        <a href="HungYen.html" class="link-box">

        <!-- HỒ CHÍ MINH -->
        <a href="HoChiMinh.html" class="link-box">
