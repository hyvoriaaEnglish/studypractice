<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Unit 5 Practice</title>

    <style>
      /* =====================================================
         RESET
      ===================================================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* =====================================================
         BODY
      ===================================================== */

      body {
        min-height: 100vh;

        background-color: #fff9fb;

        font-family: Arial, Helvetica, sans-serif;

        overflow-x: hidden;

        position: relative;
      }

      /* =====================================================
         THỎ TRANG TRÍ
      ===================================================== */

      .bunnies {
        position: fixed;

        width: 100%;
        height: 100%;

        top: 0;
        left: 0;

        pointer-events: none;

        z-index: 1;
      }

      .bunny {
        position: absolute;

        font-size: 45px;

        color: #e8a5b5;

        opacity: 0.7;

        animation: floating 4s ease-in-out infinite;
      }

      /* =====================================================
         VỊ TRÍ CÁC CHÚ THỎ
      ===================================================== */

      .bunny:nth-child(1) {
        top: 3%;
        left: 6%;
        font-size: 48px;
      }

      .bunny:nth-child(2) {
        top: 10%;
        left: 25%;
        font-size: 30px;
      }

      .bunny:nth-child(3) {
        top: 4%;
        left: 47%;
        font-size: 35px;
      }

      .bunny:nth-child(4) {
        top: 8%;
        right: 25%;
        font-size: 28px;
      }

      .bunny:nth-child(5) {
        top: 15%;
        right: 6%;
        font-size: 50px;
      }

      .bunny:nth-child(6) {
        top: 32%;
        left: 18%;
        font-size: 40px;
      }

      .bunny:nth-child(7) {
        top: 35%;
        right: 15%;
        font-size: 30px;
      }

      .bunny:nth-child(8) {
        top: 58%;
        left: 3%;
        font-size: 48px;
      }

      .bunny:nth-child(9) {
        top: 65%;
        right: 10%;
        font-size: 42px;
      }

      .bunny:nth-child(10) {
        bottom: 15%;
        left: 30%;
        font-size: 30px;
      }

      .bunny:nth-child(11) {
        bottom: 5%;
        left: 48%;
        font-size: 48px;
      }

      .bunny:nth-child(12) {
        bottom: 8%;
        right: 24%;
        font-size: 28px;
      }

      .bunny:nth-child(13) {
        bottom: 10%;
        right: 7%;
        font-size: 38px;
      }

      /* =====================================================
         HIỆU ỨNG THỎ BAY NHẸ
      ===================================================== */

      @keyframes floating {
        0% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-8px);
        }

        100% {
          transform: translateY(0);
        }
      }

      /* =====================================================
         KHU VỰC CHÍNH
      ===================================================== */

      .container {
        position: relative;

        z-index: 10;

        min-height: 100vh;

        width: 100%;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        gap: 35px;

        padding: 60px 20px;
      }

      /* =====================================================
         CÁC Ô LINK - HỒNG PASTEL
      ===================================================== */

      .link-box {
        width: 330px;

        min-height: 110px;

        padding: 20px;

        background-color: #f7c9d4;

        display: flex;

        align-items: center;

        justify-content: center;

        text-align: center;

        text-decoration: none;

        color: #7d4b5a;

        font-size: 23px;

        font-weight: 400;

        transition: all 0.3s ease;
      }

      /* =====================================================
         HIỆU ỨNG HOVER
      ===================================================== */

      .link-box:hover {
        transform: scale(1.05);

        background-color: #f1b5c4;

        box-shadow: 0 8px 20px rgba(220, 130, 155, 0.25);
      }

      /* =====================================================
         RESPONSIVE - ĐIỆN THOẠI
      ===================================================== */

      @media (max-width: 600px) {
        .container {
          gap: 25px;
        }

        .link-box {
          width: 240px;

          min-height: 85px;

          font-size: 20px;
        }

        .bunny {
          transform: scale(0.8);
        }
      }
    </style>
  </head>

  <body>
    <!-- =====================================================
         CÁC CHÚ THỎ TRANG TRÍ
    ===================================================== -->

    <div class="bunnies">
      <div class="bunny">🐰</div>

      <div class="bunny">🐰</div>

      <div class="bunny">🐰</div>

      <div class="bunny">🐰</div>

      <div class="bunny">🐰</div>

      <div class="bunny">🐰</div>

      <div class="bunny">🐰</div>

      <div class="bunny">🐰</div>

      <div class="bunny">🐰</div>

      <div class="bunny">🐰</div>

      <div class="bunny">🐰</div>

      <div class="bunny">🐰</div>

      <div class="bunny">🐰</div>
    </div>

    <!-- =====================================================
         NỘI DUNG CHÍNH
    ===================================================== -->

    <main class="container">
      <!-- PHẦN TRẮC NGHIỆM ABCD UNIT 5 -->

      <a href="../u5vocab.html" class="link-box">
        Phần trắc nghiệm ABCD Unit 5
      </a>

      <!-- PHẦN BÀI ĐỌC ĐIỀN TỪ UNIT 5 -->

      <a href="../u5read.html" class="link-box">
        Phần bài đọc điền từ Unit 5
      </a>
    </main>
  </body>
</html>
