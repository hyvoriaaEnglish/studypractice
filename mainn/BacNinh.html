<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Practice</title>

    <style>
      /* =====================================================
         RESET
      ===================================================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* =====================================================
         BODY
      ===================================================== */

      body {
        min-height: 100vh;

        background-color: white;

        font-family: Arial, Helvetica, sans-serif;

        overflow-x: hidden;

        position: relative;
      }

      /* =====================================================
         NGÔI SAO TRANG TRÍ
      ===================================================== */

      .stars {
        position: fixed;

        width: 100%;
        height: 100%;

        top: 0;
        left: 0;

        pointer-events: none;

        z-index: 1;
      }

      .star {
        position: absolute;

        /* MÀU XANH BIỂN */

        color: #6bb6d6;

        opacity: 0.65;

        animation: floating 4s ease-in-out infinite;
      }

      /* =====================================================
         VỊ TRÍ NGÔI SAO
      ===================================================== */

      .star:nth-child(1) {
        top: -15px;
        left: 7%;
        font-size: 45px;
      }

      .star:nth-child(2) {
        top: 7%;
        left: 25%;
        font-size: 30px;
      }

      .star:nth-child(3) {
        top: 2%;
        left: 47%;
        font-size: 28px;
      }

      .star:nth-child(4) {
        top: 7%;
        right: 25%;
        font-size: 30px;
      }

      .star:nth-child(5) {
        top: 15%;
        right: 6%;
        font-size: 38px;
      }

      .star:nth-child(6) {
        top: 31%;
        left: 20%;
        font-size: 40px;
      }

      .star:nth-child(7) {
        top: 33%;
        right: 16%;
        font-size: 28px;
      }

      .star:nth-child(8) {
        top: 58%;
        left: 2%;
        font-size: 46px;
      }

      .star:nth-child(9) {
        top: 64%;
        right: 12%;
        font-size: 43px;
      }

      .star:nth-child(10) {
        bottom: 13%;
        left: 30%;
        font-size: 28px;
      }

      .star:nth-child(11) {
        bottom: 3%;
        left: 48%;
        font-size: 40px;
      }

      .star:nth-child(12) {
        bottom: 7%;
        right: 24%;
        font-size: 25px;
      }

      .star:nth-child(13) {
        bottom: 8%;
        right: 8%;
        font-size: 25px;
      }

      /* =====================================================
         HIỆU ỨNG NGÔI SAO
      ===================================================== */

      @keyframes floating {
        0% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-7px);
        }

        100% {
          transform: translateY(0);
        }
      }

      /* =====================================================
         KHU VỰC CHÍNH
      ===================================================== */

      .container {
        position: relative;

        z-index: 10;

        min-height: 100vh;

        width: 100%;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        gap: 35px;

        padding: 60px 20px;
      }

      /* =====================================================
         CÁC Ô LINK - XANH BIỂN PASTEL
      ===================================================== */

      .link-box {
        width: 320px;

        min-height: 100px;

        padding: 20px;

        /* XANH BIỂN PASTEL */

        background-color: #b9dfea;

        display: flex;

        align-items: center;

        justify-content: center;

        text-align: center;

        text-decoration: none;

        color: #1f4f60;

        font-size: 23px;

        font-weight: 400;

        transition: all 0.3s ease;
      }

      /* =====================================================
         HIỆU ỨNG HOVER
      ===================================================== */

      .link-box:hover {
        transform: scale(1.05);

        background-color: #a7d3e0;

        box-shadow: 0 8px 20px rgba(90, 170, 200, 0.25);
      }

      /* =====================================================
         RESPONSIVE - ĐIỆN THOẠI
      ===================================================== */

      @media (max-width: 600px) {
        .container {
          gap: 25px;
        }

        .link-box {
          width: 240px;

          min-height: 80px;

          font-size: 20px;
        }

        .star {
          transform: scale(0.8);
        }
      }
    </style>
  </head>

  <body>
    <!-- =====================================================
         NGÔI SAO XANH BIỂN
    ===================================================== -->

    <div class="stars">
      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>

      <div class="star">★</div>
    </div>

    <!-- =====================================================
         NỘI DUNG CHÍNH
    ===================================================== -->

    <main class="container">
      <!-- PHẦN 1 -->

      <a href="../BN.html" class="link-box">
        Phần chia động từ + Word Form + Sửa lỗi sai
      </a>

      <!-- PHẦN 2 -->

      <a href="../Bn2.html" class="link-box">
        Phần bài đọc điền từ + Viết lại câu
      </a>
    </main>
  </body>
</html>
