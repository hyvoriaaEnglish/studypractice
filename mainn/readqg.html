  <head>
    <meta charset="UTF-8" />

    <title>Reading Practice</title>

    <style>
      /* =====================================================
         RESET
      ===================================================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* =====================================================
         BODY
      ===================================================== */

      body {
        min-height: 100vh;

        background-color: white;

        font-family: Arial, Helvetica, sans-serif;

        overflow-x: hidden;

        position: relative;
      }

      /* =====================================================
         TRÁI TIM TRANG TRÍ
      ===================================================== */

      .hearts {
        position: fixed;

        width: 100%;
        height: 100%;

        top: 0;
        left: 0;

        pointer-events: none;

        z-index: 1;
      }

      .heart {
        position: absolute;

        /* MÀU TÍM PASTEL */

        color: #b79ad8;

        opacity: 0.7;

        animation: floating 4s ease-in-out infinite;
      }

      /* =====================================================
         VỊ TRÍ TRÁI TIM
      ===================================================== */

      .heart:nth-child(1) {
        top: 3%;
        left: 7%;
        font-size: 40px;
      }

      .heart:nth-child(2) {
        top: 10%;
        left: 25%;
        font-size: 25px;
      }

      .heart:nth-child(3) {
        top: 4%;
        left: 47%;
        font-size: 30px;
      }

      .heart:nth-child(4) {
        top: 8%;
        right: 25%;
        font-size: 25px;
      }

      .heart:nth-child(5) {
        top: 15%;
        right: 7%;
        font-size: 40px;
      }

      .heart:nth-child(6) {
        top: 32%;
        left: 18%;
        font-size: 35px;
      }

      .heart:nth-child(7) {
        top: 35%;
        right: 15%;
        font-size: 25px;
      }

      .heart:nth-child(8) {
        top: 58%;
        left: 3%;
        font-size: 40px;
      }

      .heart:nth-child(9) {
        top: 65%;
        right: 10%;
        font-size: 35px;
      }

      .heart:nth-child(10) {
        bottom: 15%;
        left: 30%;
        font-size: 25px;
      }

      .heart:nth-child(11) {
        bottom: 5%;
        left: 48%;
        font-size: 40px;
      }

      .heart:nth-child(12) {
        bottom: 8%;
        right: 24%;
        font-size: 25px;
      }

      .heart:nth-child(13) {
        bottom: 10%;
        right: 7%;
        font-size: 30px;
      }

      /* =====================================================
         HIỆU ỨNG TRÁI TIM
      ===================================================== */

      @keyframes floating {
        0% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-7px);
        }

        100% {
          transform: translateY(0);
        }
      }

      /* =====================================================
         KHU VỰC CHÍNH
      ===================================================== */

      .container {
        position: relative;

        z-index: 10;

        min-height: 100vh;

        width: 100%;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        gap: 35px;

        padding: 60px 20px;
      }

      /* =====================================================
         TIÊU ĐỀ
      ===================================================== */

      .title {
        color: #6d527f;

        font-size: 28px;

        font-weight: 500;

        text-align: center;

        margin-bottom: 5px;
      }

      /* =====================================================
         CÁC Ô LINK - TÍM PASTEL
      ===================================================== */

      .link-box {
        width: 320px;

        min-height: 100px;

        padding: 20px;

        /* MÀU TÍM PASTEL */

        background-color: #d8c4e8;

        display: flex;

        align-items: center;

        justify-content: center;

        text-align: center;

        text-decoration: none;

        color: #543d68;

        font-size: 24px;

        font-weight: 400;

        transition: all 0.3s ease;
      }

      /* =====================================================
         HIỆU ỨNG HOVER
      ===================================================== */

      .link-box:hover {
        transform: scale(1.05);

        background-color: #cbb1df;

        box-shadow: 0 8px 20px rgba(150, 110, 190, 0.25);
      }

      /* =====================================================
         RESPONSIVE - ĐIỆN THOẠI
      ===================================================== */

      @media (max-width: 600px) {
        .container {
          gap: 25px;
        }

        .title {
          font-size: 23px;
        }

        .link-box {
          width: 240px;

          min-height: 85px;

          font-size: 20px;
        }

        .heart {
          transform: scale(0.8);
        }
      }
    </style>
  </head>
