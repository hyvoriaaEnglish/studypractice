<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luyện Tập Word Form - Theme Nâu Nhạt</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #8c6d53;
        --primary-hover: #6f533c;
        --primary-light: #f5efe6;
        --primary-accent: #d4b296;
        --bg: #fbf8f3;
        --card-bg: #ffffff;
        --text-main: #4a3b32;
        --text-muted: #7a685a;
        --correct-bg: #f0fdf4;
        --correct-border: #16a34a;
        --correct-text: #15803d;
        --wrong-bg: #fef2f2;
        --wrong-border: #dc2626;
        --wrong-text: #b91c1c;
        --shadow: 0 10px 25px rgba(140, 109, 83, 0.08);
        --radius: 18px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        line-height: 1.6;
        padding: 40px 20px;
      }

      .container {
        max-width: 820px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 30px;
      }

      header h1 {
        color: var(--primary);
        font-size: 2.2rem;
        font-weight: 800;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
      }

      header p {
        color: var(--text-muted);
        font-size: 1.05rem;
      }

      .score-board {
        position: sticky;
        top: 20px;
        z-index: 100;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(12px);
        padding: 16px 28px;
        border-radius: 50px;
        box-shadow: 0 8px 25px rgba(140, 109, 83, 0.12);
        border: 2px solid var(--primary-light);
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 35px;
        font-weight: 700;
      }

      .score-board .score {
        color: var(--primary);
        font-size: 1.05rem;
      }

      .progress-bar {
        flex-grow: 1;
        height: 12px;
        background: var(--primary-light);
        border-radius: 6px;
        margin: 0 20px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(
          90deg,
          var(--primary-accent),
          var(--primary)
        );
        transition: width 0.3s ease;
        border-radius: 6px;
      }

      .question-card {
        background: var(--card-bg);
        border-radius: var(--radius);
        padding: 28px;
        margin-bottom: 25px;
        box-shadow: var(--shadow);
        border: 1px solid #e8dfd8;
        transition: transform 0.2s ease;
      }

      .question-num {
        display: inline-block;
        background: var(--primary-light);
        color: var(--primary);
        font-weight: 800;
        padding: 5px 14px;
        border-radius: 20px;
        font-size: 0.85rem;
        margin-bottom: 14px;
        text-transform: uppercase;
      }

      .question-text {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 20px;
        line-height: 1.7;
      }

      .input-group {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .word-input {
        flex-grow: 1;
        min-width: 240px;
        padding: 14px 20px;
        border: 2px solid #d4b296;
        border-radius: 12px;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        color: var(--text-main);
        outline: none;
        transition: all 0.2s ease;
      }

      .word-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(140, 109, 83, 0.15);
      }

      .word-input:disabled {
        background-color: #fcfcfc;
        cursor: not-allowed;
      }

      .submit-btn {
        background: var(--primary);
        color: #fff;
        border: none;
        padding: 14px 28px;
        border-radius: 12px;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(140, 109, 83, 0.25);
      }

      .submit-btn:hover:not([disabled]) {
        background: var(--primary-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(140, 109, 83, 0.35);
      }

      .submit-btn[disabled] {
        opacity: 0.6;
        cursor: default;
      }

      .input-group.correct .word-input {
        background-color: var(--correct-bg) !important;
        border-color: var(--correct-border) !important;
        color: var(--correct-text) !important;
      }

      .input-group.wrong .word-input {
        background-color: var(--wrong-bg) !important;
        border-color: var(--wrong-border) !important;
        color: var(--wrong-text) !important;
      }

      .explanation {
        display: none;
        margin-top: 18px;
        padding: 16px 20px;
        border-radius: 14px;
        background-color: #f5efe6;
        border-left: 5px solid var(--primary);
        font-size: 0.95rem;
        animation: fadeIn 0.3s ease;
      }

      .explanation strong {
        color: var(--primary);
        display: block;
        margin-bottom: 6px;
        font-size: 1rem;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>☕ Word Formation Practice ☕</h1>
        <p>
          Nhập đáp án đúng vào ô trống và nhấn "Kiểm tra" hoặc ấn Enter để xem
          giải thích nhé!
        </p>
      </header>

      <div class="score-board">
        <span class="score" id="score-text">Đã làm: 0/20</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="score" id="correct-count">Đúng: 0</span>
      </div>

      <div id="questions-container"></div>
    </div>

    <script>
      const quizData = [
        {
          q: "Jason was ________ from all the major social media sites for spreading a fake news.",
          root: "PLATFORM",
          answers: ["deplatformed"],
          explain:
            "<b>deplatformed</b> (v_past): Tước quyền truy cập / Khóa tài khoản mạng xã hội.<br><i>Giải thích:</i> Cấu trúc bị động ở thì quá khứ đơn 'was + V_p2'.",
        },
        {
          q: "Liskeard and Callington are basically ________ from here, so it’ll take about the same time to get to either of them.",
          root: "DISTANT",
          answers: ["equidistant"],
          explain:
            "<b>equidistant</b> (adj): Có khoảng cách bằng nhau.<br><i>Giải thích:</i> Đứng sau liên từ 'are' và trạng từ 'basically' cần một tính từ.",
        },
        {
          q: "I really believe that it would be a major mistake to ________ any drugs that are currently illegal.",
          root: "CRIME",
          answers: ["decriminalize", "decriminalise"],
          explain:
            "<b>decriminalize</b> (v): Hợp pháp hóa / Bỏ quy định kết tội.<br><i>Giải thích:</i> Đứng sau cấu trúc chỉ mục đích 'it would be... to + V_bare'.",
        },
        {
          q: "William was ready to leave everything behind and start ________ in California.",
          root: "NEW",
          answers: ["anew"],
          explain:
            "<b>anew</b> (adv): Làm lại từ đầu / Mới hoàn toàn.<br><i>Giải thích:</i> Đứng sau động từ 'start' bổ nghĩa cho hành động khởi đầu lại.",
        },
        {
          q: "Passengers might have shrugged their shoulders ________ and relaxed with a book in their cabins.",
          root: "RESIGN",
          answers: ["resignedly"],
          explain:
            "<b>resignedly</b> (adv): Một cách nhẫn nại / Cam chịu.<br><i>Giải thích:</i> Bổ nghĩa cho hành động 'shrugged their shoulders' cần một trạng từ.",
        },
        {
          q: "When I first met your mother, I just thought she might be 40 or ________ because she looked so young.",
          root: "THERE",
          answers: ["thereabouts"],
          explain:
            "<b>thereabouts</b> (adv): Xấp xỉ / Xung quanh mức đó.<br><i>Giải thích:</i> Dùng sau con số/khoảng thời gian để chỉ sự ước lượng.",
        },
        {
          q: "________ surgery, developed by Joseph Lister, is employed by many hospitals in modern days.",
          root: "SEPTIC",
          answers: ["antiseptic"],
          explain:
            "<b>antiseptic</b> (adj): Sát trùng / Kháng khuẩn.<br><i>Giải thích:</i> Bổ nghĩa cho danh từ 'surgery' tạo thành cụm từ phẫu thuật vô trùng.",
        },
        {
          q: "For anyone who is interested in Chinese history, this book is ________ for its detail and reliability.",
          root: "RIVAL",
          answers: ["unrivalled", "unrivaled"],
          explain:
            "<b>unrivalled / unrivaled</b> (adj): Không gì sánh bằng / Không có đối thủ.<br><i>Giải thích:</i> Đứng sau tobe 'is' cần một tính từ mang nghĩa tích cực.",
        },
        {
          q: "It was very disrespectful of you to speak ________ to your grandfather.",
          root: "HAND",
          answers: ["offhandedly"],
          explain:
            "<b>offhandedly</b> (adv): Một cách tùy tiện / Thiếu tôn trọng.<br><i>Giải thích:</i> Bổ nghĩa cho động từ 'speak' cần một trạng từ.",
        },
        {
          q: "I have ________ five applicants for the second round, please contact and inform them.",
          root: "LIST",
          answers: ["shortlisted"],
          explain:
            "<b>shortlisted</b> (v_p2): Đưa vào danh sách rút gọn.<br><i>Giải thích:</i> Thì hiện tại hoàn thành 'have + V_p2'.",
        },
        {
          q: "________ children are more likely to succumb to infections.",
          root: "NOURISH",
          answers: ["malnourished", "undernourished"],
          explain:
            "<b>malnourished / undernourished</b> (adj): Suy dinh dưỡng.<br><i>Giải thích:</i> Bổ nghĩa cho danh từ 'children' ở đầu câu.",
        },
        {
          q: "The teacher was furious that half of the class had again turned in ________ work.",
          root: "STANDARD",
          answers: ["substandard"],
          explain:
            "<b>substandard</b> (adj): Dưới mức tiêu chuẩn / Tệ.<br><i>Giải thích:</i> Bổ nghĩa cho danh từ 'work'.",
        },
        {
          q: "This century has witnessed environmental destruction on an ________ scale.",
          root: "PRECEDE",
          answers: ["unprecedented"],
          explain:
            "<b>unprecedented</b> (adj): Chưa từng có tiền lệ.<br><i>Giải thích:</i> Đứng trước bổ nghĩa cho danh từ 'scale'.",
        },
        {
          q: "In physics, ________ means the complete absence of electrical resistance.",
          root: "CONDUCT",
          answers: ["superconductivity"],
          explain:
            "<b>superconductivity</b> (n): Tính siêu dẫn.<br><i>Giải thích:</i> Đóng vai trò làm danh từ chủ ngữ đứng trước động từ 'means'.",
        },
        {
          q: "I hope this is a public footpath and we're not ________ on someone's private land.",
          root: "PASS",
          answers: ["trespassing"],
          explain:
            "<b>trespassing</b> (v_ing): Xâm phạm / Đi vào đất tư.<br><i>Giải thích:</i> Cấu trúc tiếp diễn 'are not + V_ing'.",
        },
        {
          q: "The machinery has been coated with a special paint to make it ________.",
          root: "RUST",
          answers: ["rustproof"],
          explain:
            "<b>rustproof</b> (adj): Chống gỉ.<br><i>Giải thích:</i> Đứng sau cấu trúc 'make + something + adj'.",
        },
        {
          q: "The company has established total ________ over its rivals.",
          root: "SUPREME",
          answers: ["supremacy"],
          explain:
            "<b>supremacy</b> (n): Vị thế tối cao / Vị thế thống trị.<br><i>Giải thích:</i> Đứng sau tính từ 'total' cần một danh từ.",
        },
        {
          q: "Bard is a very good employee, and is very ________.",
          root: "CONSCIENCE",
          answers: ["conscientious"],
          explain:
            "<b>conscientious</b> (adj): Tận tụy / Chu đáo.<br><i>Giải thích:</i> Đứng sau tobe 'is' và trạng từ 'very' cần tính từ chỉ phẩm chất.",
        },
        {
          q: "He achieved ________ for failing a drug test after winning an Olympic final.",
          root: "NOTORIOUS",
          answers: ["notoriety"],
          explain:
            "<b>notoriety</b> (n): Sự tai tiếng.<br><i>Giải thích:</i> Đứng sau động từ 'achieved' cần một danh từ làm tân ngữ.",
        },
        {
          q: "Before enrolling on a course, you should first ensure that it has been ________ by an officially recognized body.",
          root: "VALID",
          answers: ["validated"],
          explain:
            "<b>validated</b> (v_p2): Phê chuẩn / Xác nhận hiệu lực.<br><i>Giải thích:</i> Cấu trúc bị động dạng hoàn thành 'has been + V_p2'.",
        },
      ];

      let answeredCount = 0;
      let correctCount = 0;

      function renderQuiz() {
        const container = document.getElementById("questions-container");
        quizData.forEach((item, index) => {
          const card = document.createElement("div");
          card.className = "question-card";
          card.id = `q-${index}`;

          const parts = item.q.split("________");

          card.innerHTML = `
            <div class="question-num">Câu ${index + 1} / 20</div>
            <div class="question-text">
                ${parts[0]} <strong>(____)</strong> ${parts[1]} <strong>(${item.root})</strong>
            </div>
            <div class="input-group" id="input-group-${index}">
                <input type="text" class="word-input" id="input-${index}" placeholder="Nhập đáp án..." onkeypress="handleKeyPress(event, ${index})">
                <button class="submit-btn" onclick="checkAnswer(${index})">Kiểm tra</button>
            </div>
            <div class="explanation" id="explain-${index}">
                <strong>Giải thích chi tiết:</strong>
                <div>${item.explain}</div>
            </div>
        `;
          container.appendChild(card);
        });
      }

      function handleKeyPress(event, index) {
        if (event.key === "Enter") {
          checkAnswer(index);
        }
      }

      function checkAnswer(index) {
        const inputEl = document.getElementById(`input-${index}`);
        const inputGroup = document.getElementById(`input-group-${index}`);
        const btn = inputGroup.querySelector(".submit-btn");
        const explainBox = document.getElementById(`explain-${index}`);

        const userAns = inputEl.value.trim().toLowerCase();
        if (!userAns) return;

        const validAnswers = quizData[index].answers.map((a) =>
          a.toLowerCase(),
        );
        const isCorrect = validAnswers.includes(userAns);

        inputEl.disabled = true;
        btn.disabled = true;

        if (isCorrect) {
          inputGroup.classList.add("correct");
          correctCount++;
        } else {
          inputGroup.classList.add("wrong");
          inputEl.value = `${userAns} ➔ (${quizData[index].answers[0]})`;
        }

        answeredCount++;
        explainBox.style.display = "block";

        document.getElementById("score-text").innerText =
          `Đã làm: ${answeredCount}/20`;
        document.getElementById("correct-count").innerText =
          `Đúng: ${correctCount}`;
        const percentage = (answeredCount / 20) * 100;
        document.getElementById("progress-fill").style.width = `${percentage}%`;
      }

      document.addEventListener("DOMContentLoaded", renderQuiz);
    </script>
  </body>
</html>
