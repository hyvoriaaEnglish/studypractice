<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Practice</title>

    <style>
      /* =====================================================
         RESET
      ===================================================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* =====================================================
         BODY
      ===================================================== */

      body {
        min-height: 100vh;

        background-color: white;

        font-family: Arial, Helvetica, sans-serif;

        overflow-x: hidden;

        position: relative;
      }

      /* =====================================================
         HÌNH TRÒN TRANG TRÍ
      ===================================================== */

      .circles {
        position: fixed;

        width: 100%;
        height: 100%;

        top: 0;
        left: 0;

        pointer-events: none;

        z-index: 1;
      }

      .circle {
        position: absolute;

        border-radius: 50%;

        background-color: #81d8d0;

        opacity: 0.6;

        animation: floating 4s ease-in-out infinite;
      }

      /* =====================================================
         VỊ TRÍ VÀ KÍCH THƯỚC HÌNH TRÒN
      ===================================================== */

      .circle:nth-child(1) {
        top: 3%;
        left: 7%;
        width: 55px;
        height: 55px;
      }

      .circle:nth-child(2) {
        top: 10%;
        left: 25%;
        width: 28px;
        height: 28px;
      }

      .circle:nth-child(3) {
        top: 4%;
        left: 47%;
        width: 38px;
        height: 38px;
      }

      .circle:nth-child(4) {
        top: 8%;
        right: 25%;
        width: 25px;
        height: 25px;
      }

      .circle:nth-child(5) {
        top: 15%;
        right: 7%;
        width: 50px;
        height: 50px;
      }

      .circle:nth-child(6) {
        top: 32%;
        left: 18%;
        width: 45px;
        height: 45px;
      }

      .circle:nth-child(7) {
        top: 35%;
        right: 15%;
        width: 25px;
        height: 25px;
      }

      .circle:nth-child(8) {
        top: 58%;
        left: 3%;
        width: 55px;
        height: 55px;
      }

      .circle:nth-child(9) {
        top: 65%;
        right: 10%;
        width: 45px;
        height: 45px;
      }

      .circle:nth-child(10) {
        bottom: 15%;
        left: 30%;
        width: 28px;
        height: 28px;
      }

      .circle:nth-child(11) {
        bottom: 5%;
        left: 48%;
        width: 50px;
        height: 50px;
      }

      .circle:nth-child(12) {
        bottom: 8%;
        right: 24%;
        width: 25px;
        height: 25px;
      }

      .circle:nth-child(13) {
        bottom: 10%;
        right: 7%;
        width: 35px;
        height: 35px;
      }

      /* =====================================================
         HIỆU ỨNG HÌNH TRÒN
      ===================================================== */

      @keyframes floating {
        0% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-8px);
        }

        100% {
          transform: translateY(0);
        }
      }

      /* =====================================================
         KHU VỰC CHÍNH
      ===================================================== */

      .container {
        position: relative;

        z-index: 10;

        min-height: 100vh;

        width: 100%;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        gap: 35px;

        padding: 60px 20px;
      }

      /* =====================================================
         CÁC Ô LINK - XANH TIFFANY PASTEL
      ===================================================== */

      .link-box {
        width: 320px;

        min-height: 110px;

        padding: 20px;

        background-color: #b8e8e2;

        display: flex;

        align-items: center;

        justify-content: center;

        text-align: center;

        text-decoration: none;

        color: #276d68;

        font-size: 24px;

        font-weight: 400;

        transition: all 0.3s ease;
      }

      /* =====================================================
         HIỆU ỨNG HOVER
      ===================================================== */

      .link-box:hover {
        transform: scale(1.05);

        background-color: #9cdbd4;

        box-shadow: 0 8px 20px rgba(60, 170, 160, 0.25);
      }

      /* =====================================================
         RESPONSIVE - ĐIỆN THOẠI
      ===================================================== */

      @media (max-width: 600px) {
        .container {
          gap: 25px;
        }

        .link-box {
          width: 240px;

          min-height: 85px;

          font-size: 20px;
        }

        .circle {
          transform: scale(0.8);
        }
      }
    </style>
  </head>

  <body>
    <!-- =====================================================
         HÌNH TRÒN XANH TIFFANY TRANG TRÍ
    ===================================================== -->

    <div class="circles">
      <div class="circle"></div>

      <div class="circle"></div>

      <div class="circle"></div>

      <div class="circle"></div>

      <div class="circle"></div>

      <div class="circle"></div>

      <div class="circle"></div>

      <div class="circle"></div>

      <div class="circle"></div>

      <div class="circle"></div>

      <div class="circle"></div>

      <div class="circle"></div>

      <div class="circle"></div>
    </div>

    <!-- =====================================================
         NỘI DUNG CHÍNH
    ===================================================== -->

    <main class="container">

      <a href="../u4vocab.html" class="link-box"> Phần trắc nghiệm ABCD </a>

      <!-- PHẦN BÀI ĐỌC -->

      <a href="../u4read.html" class="link-box"> Phần bài đọc </a>
    </main>

    <script src="/study-tracker.js"></script>
  </body>
</html>
