<!doctype html>

  <head>
    <meta charset="UTF-8" />

    ```
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Tiếng Anh Đại Trà</title>

    <style>
      /* =====================================================
     RESET
  ===================================================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* =====================================================
     BODY
  ===================================================== */

      body {
        min-height: 100vh;

        font-family: "Nunito", Arial, sans-serif;

        color: #4b4d68;

        background:
          radial-gradient(
            circle at 10% 10%,
            rgba(255, 255, 255, 0.8),
            transparent 25%
          ),
          radial-gradient(
            circle at 90% 20%,
            rgba(255, 255, 255, 0.7),
            transparent 25%
          ),
          linear-gradient(135deg, #ffdce9 0%, #e8e0ff 45%, #cfeeff 100%);

        position: relative;

        padding: 50px 20px 70px;

        overflow-x: hidden;
      }

      /* =====================================================
     DECORATIVE CIRCLES
  ===================================================== */

      body::before {
        content: "";

        position: fixed;

        width: 220px;
        height: 220px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.25);

        top: -70px;
        right: -60px;

        pointer-events: none;
      }

      body::after {
        content: "";

        position: fixed;

        width: 180px;
        height: 180px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.2);

        bottom: -60px;
        left: -50px;

        pointer-events: none;
      }

      /* =====================================================
     MAIN CONTAINER
  ===================================================== */

      .container {
        width: 92%;

        max-width: 1000px;

        margin: 0 auto;

        position: relative;

        z-index: 1;
      }

      /* =====================================================
     HEADER
  ===================================================== */

      .header {
        text-align: center;

        margin-bottom: 45px;
      }

      .title {
        display: inline-block;

        padding: 15px 30px;

        border-radius: 22px;

        background: rgba(255, 255, 255, 0.78);

        backdrop-filter: blur(10px);

        border: 2px solid rgba(255, 255, 255, 0.8);

        box-shadow: 0 10px 30px rgba(91, 92, 140, 0.12);

        font-family: "Baloo 2", cursive;

        font-size: clamp(34px, 5vw, 52px);

        font-weight: 800;

        background: linear-gradient(90deg, #ed719b, #a47de5, #65aee8);

        -webkit-background-clip: text;

        -webkit-text-fill-color: transparent;

        background-clip: text;
      }

      .subtitle {
        margin-top: 12px;

        font-size: 18px;

        color: #6d6f89;

        font-weight: 600;
      }

      /* =====================================================
     BACK BUTTON
  ===================================================== */

      .back {
        display: inline-flex;

        align-items: center;

        gap: 8px;

        margin-bottom: 35px;

        padding: 12px 24px;

        border-radius: 50px;

        background: rgba(255, 255, 255, 0.75);

        backdrop-filter: blur(10px);

        border: 2px solid rgba(255, 255, 255, 0.8);

        color: #6c6f9b;

        text-decoration: none;

        font-size: 18px;

        font-weight: 700;

        box-shadow: 0 8px 25px rgba(104, 100, 160, 0.12);

        transition: all 0.3s ease;
      }

      .back:hover {
        transform: translateX(-5px);

        background: white;

        color: #ed719b;

        box-shadow: 0 12px 30px rgba(104, 100, 160, 0.18);
      }

      /* =====================================================
     UNIT GRID
  ===================================================== */

      .menu {
        display: grid;

        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));

        gap: 25px;
      }

      /* =====================================================
     UNIT CARD
  ===================================================== */

      .btn {
        min-height: 150px;

        padding: 25px;

        display: flex;

        justify-content: center;

        align-items: center;

        text-align: center;

        border-radius: 28px;

        text-decoration: none;

        font-family: "Baloo 2", cursive;

        font-size: 32px;

        font-weight: 800;

        position: relative;

        overflow: hidden;

        border: 2px solid rgba(255, 255, 255, 0.7);

        box-shadow: 0 12px 30px rgba(90, 90, 130, 0.12);

        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      /* Decorative circle */

      .btn::before {
        content: "";

        position: absolute;

        width: 120px;
        height: 120px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.3);

        top: -50px;
        right: -30px;

        transition: transform 0.3s ease;
      }

      .btn::after {
        content: "";

        position: absolute;

        width: 70px;
        height: 70px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.25);

        bottom: -30px;
        left: -20px;
      }

      .btn:hover {
        transform: translateY(-8px) scale(1.02);

        box-shadow: 0 20px 40px rgba(90, 90, 130, 0.2);
      }

      .btn:hover::before {
        transform: scale(1.3);
      }

      /* =====================================================
     UNIT COLORS
  ===================================================== */

      /* UNIT 1 */

      .btn1 {
        background: linear-gradient(135deg, #ffb6ce, #ffd8e7);

        color: #8f4161;
      }

      /* UNIT 2 + 3 */

      .btn2 {
        background: linear-gradient(135deg, #a9c9ed, #d7eaff);

        color: #36577c;
      }

      /* UNIT 4 */

      .btn3 {
        background: linear-gradient(135deg, #ffc7dc, #ffeaf3);

        color: #b34f77;
      }

      /* UNIT 5 */

      .btn4 {
        background: linear-gradient(135deg, #c9b8ee, #e8e0ff);

        color: #67518d;
      }

      /* UNIT 6 */

      .btn5 {
        background: linear-gradient(135deg, #a9dfe5, #d9f4f6);

        color: #39747a;
      }

      /* UNIT 7 */

      .btn6 {
        background: linear-gradient(135deg, #ffd4b3, #ffe9d7);

        color: #9a653d;
      }

      /* UNIT 8 */

      .btn7 {
        background: linear-gradient(135deg, #f5c9dd, #d9eaff);

        color: #6a5b87;
      }

      /* =====================================================
     RESPONSIVE
  ===================================================== */

      @media (max-width: 700px) {
        body {
          padding: 30px 15px 50px;
        }

        .container {
          width: 94%;
        }

        .header {
          margin-bottom: 30px;
        }

        .title {
          font-size: 34px;

          padding: 12px 22px;
        }

        .subtitle {
          font-size: 16px;
        }

        .back {
          font-size: 16px;

          padding: 10px 20px;
        }

        .menu {
          grid-template-columns: 1fr;

          gap: 18px;
        }

        .btn {
          min-height: 110px;

          font-size: 28px;

          border-radius: 24px;
        }
      }

      /* =====================================================
     SMALL MOBILE
  ===================================================== */

      @media (max-width: 400px) {
        .title {
          font-size: 29px;
        }

        .btn {
          min-height: 100px;

          font-size: 25px;
        }
      }
    </style>
    ```
