<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Unit 2 Practice</title>

    <style>
      /* =====================================================
         RESET
      ===================================================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* =====================================================
         BODY - NỀN RỪNG XANH
      ===================================================== */

      body {
        min-height: 100vh;

        background-color: #eef7ed;

        font-family: Arial, Helvetica, sans-serif;

        overflow-x: hidden;

        position: relative;
      }

      /* =====================================================
         LỚP TRANG TRÍ THIÊN NHIÊN
      ===================================================== */

      .nature {
        position: fixed;

        width: 100%;
        height: 100%;

        top: 0;
        left: 0;

        pointer-events: none;

        z-index: 1;

        overflow: hidden;
      }

      /* =====================================================
         CÁC VÒNG TRÒN TÁN LÁ
      ===================================================== */

      .leaf-circle {
        position: absolute;

        border-radius: 50%;

        background-color: #a8d5a2;

        opacity: 0.55;

        animation: floating 5s ease-in-out infinite;
      }

      .leaf-circle:nth-child(1) {
        width: 100px;
        height: 100px;

        top: 3%;
        left: 5%;
      }

      .leaf-circle:nth-child(2) {
        width: 55px;
        height: 55px;

        top: 10%;
        left: 22%;

        background-color: #c2dfb8;
      }

      .leaf-circle:nth-child(3) {
        width: 75px;
        height: 75px;

        top: 5%;
        left: 45%;

        background-color: #91c789;
      }

      .leaf-circle:nth-child(4) {
        width: 45px;
        height: 45px;

        top: 8%;
        right: 25%;

        background-color: #c2dfb8;
      }

      .leaf-circle:nth-child(5) {
        width: 95px;
        height: 95px;

        top: 13%;
        right: 4%;

        background-color: #a8d5a2;
      }

      .leaf-circle:nth-child(6) {
        width: 70px;
        height: 70px;

        top: 35%;
        left: 5%;

        background-color: #91c789;
      }

      .leaf-circle:nth-child(7) {
        width: 50px;
        height: 50px;

        top: 38%;
        right: 10%;

        background-color: #c2dfb8;
      }

      .leaf-circle:nth-child(8) {
        width: 90px;
        height: 90px;

        bottom: 10%;
        left: 3%;

        background-color: #a8d5a2;
      }

      .leaf-circle:nth-child(9) {
        width: 65px;
        height: 65px;

        bottom: 18%;
        right: 6%;

        background-color: #91c789;
      }

      .leaf-circle:nth-child(10) {
        width: 45px;
        height: 45px;

        bottom: 8%;
        left: 30%;

        background-color: #c2dfb8;
      }

      /* =====================================================
         LÁ CÂY TRANG TRÍ
      ===================================================== */

      .leaf {
        position: absolute;

        font-size: 45px;

        opacity: 0.65;

        animation: floating 4s ease-in-out infinite;
      }

      .leaf:nth-child(11) {
        top: 25%;
        left: 12%;
      }

      .leaf:nth-child(12) {
        top: 18%;
        right: 15%;

        font-size: 35px;
      }

      .leaf:nth-child(13) {
        top: 55%;
        left: 8%;

        font-size: 40px;
      }

      .leaf:nth-child(14) {
        top: 60%;
        right: 12%;

        font-size: 45px;
      }

      .leaf:nth-child(15) {
        bottom: 20%;
        left: 20%;

        font-size: 30px;
      }

      .leaf:nth-child(16) {
        bottom: 10%;
        right: 25%;

        font-size: 38px;
      }

      /* =====================================================
         HIỆU ỨNG CHUYỂN ĐỘNG
      ===================================================== */

      @keyframes floating {
        0% {
          transform: translateY(0) rotate(0deg);
        }

        50% {
          transform: translateY(-10px) rotate(3deg);
        }

        100% {
          transform: translateY(0) rotate(0deg);
        }
      }

      /* =====================================================
         KHU VỰC CHÍNH
      ===================================================== */

      .container {
        position: relative;

        z-index: 10;

        min-height: 100vh;

        width: 100%;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        gap: 30px;

        padding: 60px 20px;
      }

      /* =====================================================
         CÁC Ô LINK - XANH LÁ PASTEL
      ===================================================== */

      .link-box {
        width: 340px;

        min-height: 100px;

        padding: 20px;

        background-color: #c5dfbd;

        display: flex;

        align-items: center;

        justify-content: center;

        text-align: center;

        text-decoration: none;

        color: #3f6540;

        font-size: 23px;

        font-weight: 400;

        transition: all 0.3s ease;
      }

      /* =====================================================
         HIỆU ỨNG HOVER
      ===================================================== */

      .link-box:hover {
        transform: scale(1.05);

        background-color: #afd19f;

        box-shadow: 0 8px 20px rgba(70, 120, 70, 0.25);
      }

      /* =====================================================
         RESPONSIVE - ĐIỆN THOẠI
      ===================================================== */

      @media (max-width: 600px) {
        .container {
          gap: 22px;
        }

        .link-box {
          width: 250px;

          min-height: 85px;

          font-size: 19px;
        }

        .leaf-circle {
          transform: scale(0.75);
        }

        .leaf {
          transform: scale(0.8);
        }
      }
    </style>
  </head>

      <div class="leaf-circle"></div>

      <div class="leaf-circle"></div>

      <div class="leaf">🍃</div>

      <div class="leaf">🌿</div>

      <div class="leaf">🍃</div>

      <div class="leaf">🌿</div>
    </div>
