  <head>
    <meta charset="UTF-8" />

    <title>Unit 8 Practice</title>

    <style>
      /* =====================================================
         RESET
      ===================================================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* =====================================================
         BODY - NỀN BE + CHẤM BI
      ===================================================== */

      body {
        min-height: 100vh;

        background-color: #f5ead7;

        /* CHẤM BI NHỎ */

        background-image: radial-gradient(#c8a982 2px, transparent 2px);

        background-size: 35px 35px;

        font-family: Arial, Helvetica, sans-serif;

        overflow-x: hidden;

        position: relative;
      }

      /* =====================================================
         LỚP PHỦ NỀN NHẸ
      ===================================================== */

      body::before {
        content: "";

        position: fixed;

        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        background-color: rgba(255, 250, 240, 0.35);

        pointer-events: none;

        z-index: 0;
      }

      /* =====================================================
         CÁC CHẤM BI TRANG TRÍ
      ===================================================== */

      .dots {
        position: fixed;

        width: 100%;
        height: 100%;

        top: 0;
        left: 0;

        pointer-events: none;

        z-index: 1;
      }

      .dot {
        position: absolute;

        border-radius: 50%;

        background-color: #9b7653;

        opacity: 0.55;

        animation: floating 4s ease-in-out infinite;
      }

      /* =====================================================
         VỊ TRÍ CÁC CHẤM BI
      ===================================================== */

      .dot:nth-child(1) {
        top: 5%;
        left: 7%;

        width: 45px;
        height: 45px;
      }

      .dot:nth-child(2) {
        top: 12%;
        left: 25%;

        width: 20px;
        height: 20px;
      }

      .dot:nth-child(3) {
        top: 4%;
        left: 47%;

        width: 30px;
        height: 30px;
      }

      .dot:nth-child(4) {
        top: 9%;
        right: 25%;

        width: 18px;
        height: 18px;
      }

      .dot:nth-child(5) {
        top: 15%;
        right: 7%;

        width: 42px;
        height: 42px;
      }

      .dot:nth-child(6) {
        top: 32%;
        left: 18%;

        width: 35px;
        height: 35px;
      }

      .dot:nth-child(7) {
        top: 35%;
        right: 15%;

        width: 20px;
        height: 20px;
      }

      .dot:nth-child(8) {
        top: 58%;
        left: 3%;

        width: 45px;
        height: 45px;
      }

      .dot:nth-child(9) {
        top: 65%;
        right: 10%;

        width: 35px;
        height: 35px;
      }

      .dot:nth-child(10) {
        bottom: 15%;
        left: 30%;

        width: 20px;
        height: 20px;
      }

      .dot:nth-child(11) {
        bottom: 5%;
        left: 48%;

        width: 42px;
        height: 42px;
      }

      .dot:nth-child(12) {
        bottom: 8%;
        right: 24%;

        width: 18px;
        height: 18px;
      }

      .dot:nth-child(13) {
        bottom: 10%;
        right: 7%;

        width: 30px;
        height: 30px;
      }

      /* =====================================================
         HIỆU ỨNG CHẤM BI
      ===================================================== */

      @keyframes floating {
        0% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-8px);
        }

        100% {
          transform: translateY(0);
        }
      }

      /* =====================================================
         KHU VỰC CHÍNH
      ===================================================== */

      .container {
        position: relative;

        z-index: 10;

        min-height: 100vh;

        width: 100%;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        gap: 35px;

        padding: 60px 20px;
      }

      /* =====================================================
         CÁC Ô LINK - MÀU BE
      ===================================================== */

      .link-box {
        width: 320px;

        min-height: 105px;

        padding: 20px;

        /* MÀU BE */

        background-color: #e8d2b5;

        display: flex;

        align-items: center;

        justify-content: center;

        text-align: center;

        text-decoration: none;

        /* MÀU NÂU */

        color: #654832;

        font-size: 24px;

        font-weight: 400;

        transition: all 0.3s ease;
      }

      /* =====================================================
         HIỆU ỨNG HOVER
      ===================================================== */

      .link-box:hover {
        transform: scale(1.05);

        background-color: #dcc09c;

        box-shadow: 0 8px 20px rgba(110, 75, 45, 0.25);
      }

      /* =====================================================
         RESPONSIVE - ĐIỆN THOẠI
      ===================================================== */

      @media (max-width: 600px) {
        .container {
          gap: 25px;
        }

        .link-box {
          width: 240px;

          min-height: 85px;

          font-size: 20px;
        }

        .dot {
          transform: scale(0.8);
        }
      }
    </style>
  </head>
